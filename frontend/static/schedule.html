<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendario — Fantasy SV</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/auth.js"></script>

  <style>
    /* ── Variables ── */
    :root {
      --navy:       #080e1c;
      --navy-mid:   #0c1830;
      --card:       #101f3a;
      --card-hi:    #152444;
      --teal:       #00d4aa;
      --teal-bright:#22f0c7;
      --teal-dim:   rgba(0,212,170,.18);
      --gold:       #f5c518;
      --gold-dim:   rgba(245,197,24,.15);
      --red:        #ff4d6d;
      --red-dim:    rgba(255,77,109,.15);
      --blue:       #00a8e8;
      --text:       #e8f0ff;
      --dim:        rgba(232,240,255,.45);
      --muted:      rgba(232,240,255,.22);
      --font-head:  'Bebas Neue', sans-serif;
      --font-body:  'Nunito', sans-serif;
      --radius:     14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% 10%, rgba(0,212,170,.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(0,168,232,.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(245,197,24,.03) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Nav ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,14,28,.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0,212,170,.12);
      padding: 0 20px;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 56px;
    }

    .nav-brand {
      font-family: var(--font-head);
      font-size: 1.5rem;
      letter-spacing:.06em;
      color: var(--teal);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .nav-link {
      font-size: .82rem;
      font-weight: 700;
      color: var(--dim);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 50px;
      transition: all .15s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255,255,255,.06);
    }

    /* ── Page hero ── */
    .hero {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 20px 20px;
    }

    .hero-eyebrow {
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: var(--font-head);
      font-size: clamp(3.2rem, 8vw, 6rem);
      line-height: .95;
      letter-spacing: .02em;
      color: var(--text);
    }

    .hero-title span {
      color: var(--teal);
    }

    .hero-sub {
      margin-top: 14px;
      font-size: 1rem;
      color: var(--dim);
      max-width: 460px;
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: .78rem;
      font-weight: 800;
      color: var(--dim);
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .season-select {
      background: var(--card);
      border: 1px solid rgba(0,212,170,.25);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: var(--font-body);
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }

    .season-select:focus {
      border-color: var(--teal);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 7px 16px;
      border-radius: 50px;
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .04em;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all .18s;
    }

    .pill-all {
      background: rgba(255,255,255,.06);
      color: var(--dim);
      border-color: rgba(255,255,255,.08);
    }

    .pill-upcoming {
      background: var(--teal-dim);
      color: var(--teal);
      border-color: rgba(0,212,170,.3);
    }

    .pill-live {
      background: var(--gold-dim);
      color: var(--gold);
      border-color: rgba(245,197,24,.35);
    }

    .pill-finished {
      background: var(--red-dim);
      color: var(--dim);
      border-color: rgba(255,255,255,.1);
    }

    .pill.active {
      background: var(--teal);
      color: #080e1c;
      border-color: var(--teal);
    }

    .pill-live.active {
      background: var(--gold);
      color: #080e1c;
      border-color: var(--gold);
    }

    .pill-finished.active {
      background: rgba(255,255,255,.15);
      color: var(--text);
      border-color: rgba(255,255,255,.25);
    }

    /* ── Main ── */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 32px auto 60px;
      padding: 0 20px;
    }

    /* ── Matchday ── */
    .matchday-section {
      margin-bottom: 40px;
      animation: fadeUp .4s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity:0;
        transform: translateY(16px);
      }
      to {
        opacity:1;
        transform:none;
      }
    }

    .matchday-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .matchday-number {
      font-family: var(--font-head);
      font-size: 3rem;
      line-height: 1;
      color: rgba(255,255,255,.08);
      letter-spacing: .04em;
      min-width: 64px;
      text-align: right;
    }

    .matchday-meta {
      flex: 1;
    }

    .matchday-name {
      font-family: var(--font-head);
      font-size: 1.4rem;
      letter-spacing: .05em;
      color: var(--text);
    }

    .matchday-detail {
      font-size: .78rem;
      font-weight: 700;
      color: var(--dim);
      margin-top: 2px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .md-status {
      padding: 3px 10px;
      border-radius: 50px;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .md-status.scheduled {
      background: var(--teal-dim);
      color: var(--teal);
    }

    .md-status.in_progress {
      background: var(--gold-dim);
      color: var(--gold);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .md-status.closed {
      background: rgba(255,255,255,.08);
      color: var(--muted);
    }

    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:.55; }
    }

    .lock-line {
      font-size: .72rem;
      color: var(--dim);
    }

    .lock-line.locked {
      color: var(--red);
    }

    .md-divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(0,212,170,.25), transparent);
    }

    /* ── Fixtures ── */
    .fixtures-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .fixture-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        180deg,
        rgba(18,30,54,.98) 0%,
        rgba(14,24,44,.98) 100%
      );
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      padding: 18px;
      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;
      backdrop-filter: blur(10px);
    }

    .fixture-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .fixture-card::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.06), transparent 40%);
    }

    .fixture-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,170,.28);
      box-shadow:
        0 18px 48px rgba(0,0,0,.55),
        0 0 0 1px rgba(0,212,170,.08);
    }

    .fixture-card:hover::after {
      opacity: 1;
    }

    .fixture-card:hover .team-badge {
      transform: scale(1.08);
    }

    /* ── Upcoming ── */
    .fixture-card::before {
      background: linear-gradient(
        90deg,
        var(--teal),
        rgba(0,212,170,.15)
      );
    }

    /* ── Live ── */
    .fixture-card.live {
      border-color: rgba(245,197,24,.32);
      box-shadow:
        0 0 0 1px rgba(245,197,24,.08),
        0 0 30px rgba(245,197,24,.12);
    }

    .fixture-card.live::before {
      opacity: 1;
      background: linear-gradient(
        90deg,
        var(--gold),
        rgba(245,197,24,.1)
      );
    }

    /* ── FINISHED CARD IMPROVEMENTS ── */
    .fixture-card.finished {
      background:
        linear-gradient(
          180deg,
          rgba(14,28,34,.98) 0%,
          rgba(10,20,28,.98) 100%
        );
      border-color: rgba(0,212,170,.22);
      box-shadow:
        0 0 0 1px rgba(0,212,170,.08),
        0 10px 36px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.03);
    }

    .fixture-card.finished::before {
      opacity: 1;
      background:
        linear-gradient(
          90deg,
          rgba(0,212,170,1),
          rgba(34,240,199,.75),
          rgba(0,212,170,.12)
        );
      box-shadow: 0 0 18px rgba(0,212,170,.4);
    }

    .fixture-card.finished::after {
      opacity: 1;
      background:
        radial-gradient(circle at top right, rgba(0,212,170,.08), transparent 42%);
    }

    .fixture-card.finished:hover {
      transform: translateY(-5px);
      border-color: rgba(34,240,199,.42);
      box-shadow:
        0 20px 54px rgba(0,0,0,.6),
        0 0 0 1px rgba(34,240,199,.18),
        0 0 34px rgba(0,212,170,.16);
    }

    .fixture-card.finished .team-name {
      color: rgba(232,240,255,.92);
    }

    .fixture-card.finished .team-name.dim {
      color: rgba(232,240,255,.72);
    }

    .fixture-card.finished .team-badge {
      border: 1px solid rgba(255,255,255,.05);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 14px rgba(0,0,0,.18);
    }

    .fixture-card.finished .fixture-kickoff {
      color: rgba(232,240,255,.55);
    }

    .fixture-card.finished .kickoff-dot.done {
      background: var(--teal);
      box-shadow: 0 0 10px rgba(0,212,170,.5);
    }

    .fixture-card.finished .vs-text.finished {
      color: rgba(0,212,170,.9);
      text-shadow: 0 0 12px rgba(0,212,170,.25);
    }

    /* ── Kickoff ── */
    .fixture-kickoff {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kickoff-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      flex-shrink: 0;
    }

    .kickoff-dot.live {
      background: var(--gold);
      animation: pulse 1s ease-in-out infinite;
    }

    .kickoff-dot.done {
      background: var(--muted);
    }

    /* ── Matchup ── */
    .fixture-matchup {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-block {
      flex: 1;
      text-align: center;
    }

    .team-badge {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 1.15rem;
      letter-spacing: .04em;
      margin: 0 auto 8px;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
      position: relative;
      background: rgba(255,255,255,.04);
      overflow: hidden;
    }

    .crest-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
      display: block;
    }

    .crest-fallback {
      font-size: 1.6rem;
      line-height: 1;
    }

    .team-name {
      font-size: .84rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-name.dim {
      color: var(--dim);
    }

    .vs-block {
      flex-shrink: 0;
      text-align: center;
      min-width: 54px;
    }

    .vs-text {
      font-family: var(--font-head);
      font-size: 1.4rem;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .vs-text.finished {
      color: var(--dim);
      font-size: 1rem;
    }

    /* ── Badge colors ── */
    .badge-0  { background: rgba(0,212,170,.2);  color: var(--teal); }
    .badge-1  { background: rgba(0,168,232,.2);  color: var(--blue); }
    .badge-2  { background: rgba(245,197,24,.2); color: var(--gold); }
    .badge-3  { background: rgba(255,77,109,.2); color: var(--red); }
    .badge-4  { background: rgba(192,132,252,.2);color: #c084fc; }
    .badge-5  { background: rgba(251,146,60,.2); color: #fb923c; }
    .badge-6  { background: rgba(34,211,238,.2); color: #22d3ee; }
    .badge-7  { background: rgba(163,230,53,.2); color: #a3e635; }

    /* ── Empty ── */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--dim);
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 1rem;
      font-weight: 700;
    }

    /* ── Skeleton ── */
    .skeleton {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }

    .skel-shimmer {
      height: 110px;
      background: linear-gradient(
        90deg,
        var(--card) 0%,
        var(--card-hi) 50%,
        var(--card) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Countdown ── */
    .countdown {
      font-family: var(--font-head);
      font-size: .85rem;
      letter-spacing: .1em;
      color: var(--teal);
      margin-top: 8px;
    }

    .countdown.soon {
      color: var(--gold);
    }

    .countdown.locked {
      color: var(--red);
    }

    /* ── Stats ── */
    .stats-strip {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      padding: 20px 0 28px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      margin-bottom: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-val {
      font-family: var(--font-head);
      font-size: 2.4rem;
      line-height: 1;
      color: var(--teal);
    }

    .stat-label {
      font-size: .72rem;
      font-weight: 800;
      color: var(--dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Result Section ── */
    .fixture-result {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .fixture-card.finished .fixture-result {
      border-top-color: rgba(0,212,170,.14);
    }

    .fixture-result span {
      font-size: .9rem;
      font-weight: 900;
    }

    .fixture-result > span:nth-child(1),
    .fixture-result > span:nth-child(3) {
      font-size: 1.25rem;
      font-family: var(--font-head);
      letter-spacing: .05em;
      color: var(--text);
    }

    .winner-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: .9rem;
      letter-spacing: .04em;
      background: rgba(0,212,170,.18);
      color: var(--teal-bright);
      border: 1px solid rgba(0,212,170,.24);
      box-shadow:
        0 0 18px rgba(0,212,170,.16),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .draw-badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
      color: rgba(232,240,255,.75);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .hero-title {
        font-size: 3rem;
      }

      .fixtures-grid {
        grid-template-columns: 1fr;
      }

      .matchday-number {
        font-size: 2rem;
        min-width: 44px;
      }

      .fixture-card {
        padding: 16px;
      }

      .team-badge {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body x-data="scheduleApp()" x-init="init()">

<!-- ── NAV ── -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">FANTASY SV</a>

    <div class="nav-links">
      <a href="/squad-builder" class="nav-link">Mi Equipo</a>
      <a href="/schedule" class="nav-link active">Calendario</a>
      <a href="/leaderboard" class="nav-link">Clasificación</a>
    </div>
  </div>
</nav>

<!-- ── HERO ── -->
<div class="hero">
  <div class="hero-eyebrow">Temporada 2025</div>

  <h1 class="hero-title">
    PARTIDOS<br>
    <span>PROGRAMADOS</span>
  </h1>

  <p class="hero-sub">
    Todos los partidos y jornadas mientras se desarrolla el torneo.
  </p>
</div>

<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <span class="filter-label">Temporada</span>

  <select
    class="season-select"
    x-model="selectedSeasonId"
    @change="onSeasonChange()"
  >
    <option value="">— Seleccionar temporada —</option>

    <template x-for="s in seasons" :key="s.id">
      <option :value="s.id" x-text="s.name"></option>
    </template>
  </select>

  <div class="filter-pills" x-show="selectedSeasonId">
    <button
      class="pill pill-all"
      :class="filter==='all'?'active':''"
      @click="filter='all'"
    >
      Todos
    </button>

    <button
      class="pill pill-upcoming"
      :class="filter==='upcoming'?'active':''"
      @click="filter='upcoming'"
    >
      Próximos
    </button>

    <button
      class="pill pill-live"
      :class="filter==='live'?'active':''"
      @click="filter='live'"
    >
      En Vivo
    </button>

    <button
      class="pill pill-finished"
      :class="filter==='finished'?'active':''"
      @click="filter='finished'"
    >
      Finalizados
    </button>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main">

  <!-- Stats strip -->
  <div class="stats-strip" x-show="selectedSeasonId && !loading">
    <div class="stat-item">
      <div class="stat-val" x-text="totalMatchdays"></div>
      <div class="stat-label">Jornadas</div>
    </div>

    <div class="stat-item">
      <div class="stat-val" x-text="totalFixtures"></div>
      <div class="stat-label">Partidos</div>
    </div>

    <div class="stat-item">
      <div class="stat-val" x-text="finishedFixtures"></div>
      <div class="stat-label">Jugados</div>
    </div>

    <div class="stat-item">
      <div class="stat-val" x-text="upcomingFixtures"></div>
      <div class="stat-label">Próximos</div>
    </div>
  </div>

  <!-- Loading skeletons -->
  <template x-if="loading">
    <div style="display:flex;flex-direction:column;gap:32px;">
      <template x-for="i in [1,2,3]" :key="i">
        <div>
          <div
            style="width:180px;height:20px;border-radius:6px;background:var(--card-hi);margin-bottom:14px;"
          ></div>

          <div
            style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;"
          >
            <template x-for="j in [1,2]" :key="j">
              <div class="skeleton">
                <div class="skel-shimmer"></div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- No season selected -->
  <div class="empty-state" x-show="!selectedSeasonId && !loading">
    <div class="empty-icon">🏆</div>
    <div class="empty-text">
      Selecciona una temporada para ver el calendario
    </div>
  </div>

  <!-- No results -->
  <div
    class="empty-state"
    x-show="selectedSeasonId && !loading && filteredMatchdays.length === 0"
  >
    <div class="empty-icon">📭</div>

    <div class="empty-text">
      No hay jornadas que coincidan con este filtro
    </div>
  </div>

  <!-- Matchdays -->
  <template x-for="(md, mdIdx) in filteredMatchdays" :key="md.id">

    <div
      class="matchday-section"
      :style="`animation-delay:${mdIdx * 60}ms`"
    >

      <!-- Header -->
      <div class="matchday-header">

        <div
          class="matchday-number"
          x-text="String(mdIdx+1).padStart(2,'0')"
        ></div>

        <div class="matchday-meta">

          <div class="matchday-name" x-text="md.name"></div>

          <div class="matchday-detail">

            <span
              class="md-status"
              :class="md.status"
              x-text="mdStatusLabel(md.status)"
            ></span>

            <span
              class="lock-line"
              :class="md.is_locked?'locked':''"
              x-show="md.lock_at_utc"
              x-text="md.is_locked
                ? '🔒 Bloqueado'
                : '🔓 Se bloquea ' + fmtRelative(md.lock_at_utc)"
            >
            </span>

          </div>
        </div>

        <div class="md-divider"></div>

      </div>

      <!-- Fixtures -->
      <div
        class="fixtures-grid"
        x-show="md.fixtures && md.fixtures.length > 0"
      >

        <template x-for="(f, fi) in md.fixtures" :key="f.id">

          <div class="fixture-card" :class="fixtureClass(f)">

            <div class="fixture-kickoff">

              <span
                class="kickoff-dot"
                :class="fixtureClass(f)"
              ></span>

              <span x-text="fmtKickoff(f.kickoff_utc)"></span>

              <span
                x-show="isLive(f)"
                style="margin-left:4px;color:var(--gold);font-weight:900;"
              >
                ● EN VIVO
              </span>

            </div>

            <div class="fixture-matchup">

              <!-- Home -->
              <div class="team-block">

                <div class="team-badge">
                  <img
                    :src="teamCrest(f.home_name)"
                    :alt="f.home_name || 'Equipo local'"
                    class="crest-img"
                    @error="onCrestError($event, f.home_name)"
                  />
                  <span class="crest-fallback" style="display:none;"></span>
                </div>

                <div
                  class="team-name"
                  x-text="f.home_name || 'Por Confirmar'"
                ></div>

              </div>

              <!-- VS -->
              <div class="vs-block">

                <div
                  class="vs-text"
                  :class="f.finished?'finished':''"
                >

                  <span x-show="!f.finished">VS</span>

                  <span
                    x-show="f.finished"
                    style="font-size:0.7rem;color:var(--dim);font-family:var(--font-body);font-weight:800;"
                  >
                    FT
                  </span>

                </div>

                <!-- Countdown -->
                <div
                  class="countdown"
                  :class="countdownClass(f.kickoff_utc)"
                  x-show="!f.finished && !isLive(f)"
                  x-text="countdown(f.kickoff_utc)"
                >
                </div>

              </div>

              <!-- Away -->
              <div class="team-block">

                <div class="team-badge">
                  <img
                    :src="teamCrest(f.away_name)"
                    :alt="f.away_name || 'Equipo visitante'"
                    class="crest-img"
                    @error="onCrestError($event, f.away_name)"
                  />
                  <span class="crest-fallback" style="display:none;"></span>
                </div>

                <div
                  class="team-name"
                  :class="f.finished?'dim':''"
                  x-text="f.away_name || 'Por Confirmar'"
                ></div>

              </div>

            </div>

            <!-- Result -->
            <div
              class="fixture-result"
              x-show="f.finished && f.home_goals !== null && f.away_goals !== null"
            >

              <span x-text="f.home_goals"></span>

              <span>-</span>

              <span x-text="f.away_goals"></span>

              <span
                x-show="f.winner_team_id"
                class="winner-badge"
                :class="badgeClass(f.winner_team_id)"
              >
                🏆
              </span>

            </div>

          </div>

        </template>

      </div>

      <!-- Empty fixtures -->
      <div
        x-show="!md.fixtures || md.fixtures.length === 0"
        style="color:var(--muted);font-size:.85rem;font-weight:700;padding:12px 0 4px;"
      >
        Partidos aún no anunciados
      </div>

    </div>

  </template>

</div>

<script>
function scheduleApp() {
  return {
    seasons: [],
    selectedSeasonId: '',
    matchdays: [],
    allTeams: {},
    filter: 'all',
    loading: false,
    _ticker: null,
    _now: new Date(),

    async init() {
      this._ticker = setInterval(() => {
        this._now = new Date();
      }, 30000);

      try {
        const res = await fetch('/seasons');

        if (res.ok) {
          const d = await res.json();

          this.seasons = d.seasons ?? [];

          const active =
            this.seasons.find(s => s.status === 'active')
            ?? this.seasons[0];

          if (active) {
            this.selectedSeasonId = active.id;
            await this.onSeasonChange();
          }
        }

      } catch {}
    },

    async onSeasonChange() {

      if (!this.selectedSeasonId) {
        this.matchdays = [];
        return;
      }

      this.loading = true;

      try {

        const [resM, resT] = await Promise.all([
          fetch(`/seasons/${this.selectedSeasonId}/matchdays`),
          fetch(`/seasons/${this.selectedSeasonId}/teams`)
        ]);

        if (resT.ok) {

          const d = await resT.json();

          this.allTeams = {};

          (d.teams ?? []).forEach(t => {
            this.allTeams[t.id] = t.name;
          });

        }

        if (!resM.ok) throw new Error();

        const d = await resM.json();

        const mds = d.matchdays ?? [];

        const enriched = await Promise.all(
          mds.map(async md => {

            try {

              const r = await fetch(`/matchday/${md.id}/fixtures`);

              if (r.ok) {

                const fd = await r.json();

                const fixtures = await Promise.all(
                  (fd.fixtures ?? []).map(async f => {

                    let result = null;

                    if (f.finished) {
                      result = await this.getFixtureResult(md.id, f.id);
                    }

                    console.log('fixture result', {
                      fixtureId: f.id,
                      result
                    });

                    return {
                      ...f,

                      home_name:
                        this.allTeams[f.home_team_id] ?? null,

                      away_name:
                        this.allTeams[f.away_team_id] ?? null,

                      home_goals:
                        result?.home_goals ?? null,

                      away_goals:
                        result?.away_goals ?? null,

                      winner_team_id:
                        result?.winner_team_id ?? null,
                    };
                  })
                );

                md.fixtures = fixtures;

              } else {

                md.fixtures = [];

              }

            } catch {

              md.fixtures = [];

            }

            return md;
          })
        );

        this.matchdays = enriched.sort((a, b) => {

          const order = {
            in_progress: 0,
            scheduled: 1,
            closed: 2
          };

          const ao = order[a.status] ?? 1;
          const bo = order[b.status] ?? 1;

          if (ao !== bo) return ao - bo;

          const at = a.lock_at_utc
            ? new Date(a.lock_at_utc)
            : new Date(0);

          const bt = b.lock_at_utc
            ? new Date(b.lock_at_utc)
            : new Date(0);

          return at - bt;

        });

      } catch {

        this.matchdays = [];

      } finally {

        this.loading = false;

      }
    },

    get filteredMatchdays() {

      if (this.filter === 'all') {
        return this.matchdays;
      }

      if (this.filter === 'upcoming') {
        return this.matchdays.filter(
          m => m.status === 'scheduled'
        );
      }

      if (this.filter === 'live') {
        return this.matchdays.filter(
          m => m.status === 'in_progress'
        );
      }

      if (this.filter === 'finished') {
        return this.matchdays.filter(
          m => m.status === 'closed'
        );
      }

      return this.matchdays;
    },

    get totalMatchdays() {
      return this.matchdays.length;
    },

    get totalFixtures() {
      return this.matchdays.reduce(
        (s,m) => s + (m.fixtures?.length ?? 0),
        0
      );
    },

    get finishedFixtures() {
      return this.matchdays.reduce(
        (s,m) => s + (m.fixtures?.filter(f=>f.finished).length ?? 0),
        0
      );
    },

    get upcomingFixtures() {
      return this.matchdays.reduce(
        (s,m) => s + (m.fixtures?.filter(f=>!f.finished).length ?? 0),
        0
      );
    },

    mdStatusLabel(s) {
      return {
        scheduled: 'PRÓXIMO',
        in_progress: '● EN VIVO',
        closed: 'FINALIZADO'
      }[s] ?? s.toUpperCase();
    },

    fixtureClass(f) {
      if (f.finished) return 'finished';
      if (this.isLive(f)) return 'live';
      return '';
    },

    isLive(f) {

      if (f.finished) return false;

      const ko = new Date(f.kickoff_utc);

      const now = this._now;

      return ko <= now && now - ko < 2 * 60 * 60 * 1000;
    },

    fmtKickoff(iso) {

      const d = new Date(iso);

      return d.toLocaleDateString('es-ES', {
        weekday:'short',
        day:'numeric',
        month:'short'
      }) + ' · ' + d.toLocaleTimeString('es-ES', {
        hour:'2-digit',
        minute:'2-digit'
      });

    },

    fmtRelative(iso) {

      if (!iso) return '';

      const diff = new Date(iso) - new Date();

      if (diff <= 0) return 'ahora';

      const h = Math.floor(diff / 3600000);

      const m = Math.floor((diff % 3600000) / 60000);

      if (h > 48) return `en ${Math.floor(h/24)}d`;

      if (h > 0) return `en ${h}h ${m}m`;

      return `en ${m}m`;
    },

    countdown(iso) {

      const diff = new Date(iso) - this._now;

      if (diff <= 0) return '';

      const d = Math.floor(diff / 86400000);

      const h = Math.floor((diff % 86400000) / 3600000);

      const m = Math.floor((diff % 3600000) / 60000);

      if (d > 0) return `${d}d ${h}h`;

      if (h > 0) return `${h}h ${m}m`;

      return `${m}m`;
    },

    countdownClass(iso) {

      const diff = new Date(iso) - this._now;

      if (diff < 0) return '';

      if (diff < 60 * 60 * 1000) return 'soon';

      return '';
    },

    // ── TEAM CREST MAP ──
    // Maps team name (as returned by API) → { id, flag }
    // id matches /img/crest/{id}.png filenames
    TEAM_MAP: {
      "Uruguay":              { id: 1,  flag: "🇺🇾" },
      "Germany":              { id: 2,  flag: "🇩🇪" },
      "Spain":                { id: 3,  flag: "🇪🇸" },
      "Paraguay":             { id: 4,  flag: "🇵🇾" },
      "Argentina":            { id: 5,  flag: "🇦🇷" },
      "Ghana":                { id: 6,  flag: "🇬🇭" },
      "Brazil":               { id: 7,  flag: "🇧🇷" },
      "Portugal":             { id: 8,  flag: "🇵🇹" },
      "Japan":                { id: 9,  flag: "🇯🇵" },
      "Mexico":               { id: 10, flag: "🇲🇽" },
      "England":              { id: 11, flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" },
      "United States":        { id: 12, flag: "🇺🇸" },
      "South Korea":          { id: 13, flag: "🇰🇷" },
      "France":               { id: 14, flag: "🇫🇷" },
      "South Africa":         { id: 15, flag: "🇿🇦" },
      "Algeria":              { id: 16, flag: "🇩🇿" },
      "Australia":            { id: 17, flag: "🇦🇺" },
      "New Zealand":          { id: 18, flag: "🇳🇿" },
      "Switzerland":          { id: 19, flag: "🇨🇭" },
      "Ecuador":              { id: 20, flag: "🇪🇨" },
      "Sweden":               { id: 21, flag: "🇸🇪" },
      "Czechia":              { id: 22, flag: "🇨🇿" },
      "Croatia":              { id: 23, flag: "🇭🇷" },
      "Saudi Arabia":         { id: 24, flag: "🇸🇦" },
      "Tunisia":              { id: 25, flag: "🇹🇳" },
      "Turkey":               { id: 26, flag: "🇹🇷" },
      "Senegal":              { id: 27, flag: "🇸🇳" },
      "Belgium":              { id: 28, flag: "🇧🇪" },
      "Morocco":              { id: 29, flag: "🇲🇦" },
      "Austria":              { id: 30, flag: "🇦🇹" },
      "Colombia":             { id: 31, flag: "🇨🇴" },
      "Egypt":                { id: 32, flag: "🇪🇬" },
      "Canada":               { id: 33, flag: "🇨🇦" },
      "Haiti":                { id: 34, flag: "🇭🇹" },
      "Iran":                 { id: 35, flag: "🇮🇷" },
      "Bosnia-Herzegovina":   { id: 36, flag: "🇧🇦" },
      "Panama":               { id: 37, flag: "🇵🇦" },
      "Cape Verde Islands":   { id: 38, flag: "🇨🇻" },
      "Congo DR":             { id: 39, flag: "🇨🇩" },
      "Ivory Coast":          { id: 40, flag: "🇨🇮" },
      "Qatar":                { id: 41, flag: "🇶🇦" },
      "Jordan":               { id: 42, flag: "🇯🇴" },
      "Iraq":                 { id: 43, flag: "🇮🇶" },
      "Uzbekistan":           { id: 44, flag: "🇺🇿" },
      "Netherlands":          { id: 45, flag: "🇳🇱" },
      "Norway":               { id: 46, flag: "🇳🇴" },
      "Scotland":             { id: 47, flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿" },
      "Curaçao":              { id: 48, flag: "🇨🇼" },
    },

    teamCrest(name) {
      const team = this.TEAM_MAP[name];
      if (!team) return '';
      return `/img/crest/${team.id}.png`;
    },

    onCrestError(event, name) {
      // Hide broken image, show flag emoji fallback
      const img = event.target;
      const fallback = img.nextElementSibling;
      img.style.display = 'none';
      if (fallback) {
        const team = this.TEAM_MAP[name];
        fallback.textContent = team ? team.flag : '🏳️';
        fallback.style.display = 'inline';
      }
    },

    async getFixtureResult(matchdayId, fixtureId) {

      try {

        const res = await fetch(
          `/matchday/${matchdayId}/fixture/${fixtureId}/result`
        );

        if (res.ok) {

          const d = await res.json();

          return d;

        }

      } catch {}

      return null;
    },
  };
}
</script>

</body>
</html>
