<!doctype html>
<html lang="en" x-data="onboardingApp()" x-init="init()">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Name Your Team — Fantasy SV</title>
        <link rel="stylesheet" href="style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <style>
            /* Design Tokens */
            :root {
                --primary-blue: #0d47ff;
                --secondary-purple: #7b2cff;
                --success-green: #00d26a;
                --danger-red: #ff3d4d;
                --gold: #f8c63a;
                --background: #0b1020;
                --surface: #151c32;
                --text: #ffffff;
                --muted-text: #a6b0c3;
                --border-radius: 16px;
                --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                --shadow: 0 8px 32px rgba(13, 71, 255, 0.2);
                --glow-blue: 0 0 15px rgba(13, 71, 255, 0.7);
                --glow-purple: 0 0 15px rgba(123, 44, 255, 0.7);
                --glow-gold: 0 0 15px rgba(248, 198, 58, 0.7);
                --glow-red: 0 0 15px rgba(255, 61, 77, 0.7);
            }

            /* Base Styles */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Inter", sans-serif;
                background: var(--background);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
                background:
                    radial-gradient(
                        circle at top right,
                        rgba(13, 71, 255, 0.15) 0%,
                        transparent 40%
                    ),
                    radial-gradient(
                        circle at bottom left,
                        rgba(123, 44, 255, 0.15) 0%,
                        transparent 40%
                    ),
                    linear-gradient(135deg, #0b1020 0%, #151c32 100%);
                position: relative;
                overflow-x: hidden;
            }

            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background:
                    radial-gradient(
                        circle at 10% 20%,
                        rgba(13, 71, 255, 0.1) 0%,
                        transparent 20%
                    ),
                    radial-gradient(
                        circle at 90% 80%,
                        rgba(123, 44, 255, 0.1) 0%,
                        transparent 20%
                    );
                z-index: -1;
            }

            /* Auth Page */
            .auth-page {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
            }

            /* Auth Card */
            .auth-card {
                background: #151c32;
                border: 1px solid rgba(13, 71, 255, 0.25);
                border-radius: var(--border-radius);
                padding: 40px 36px;
                width: 100%;
                max-width: 500px;
                box-shadow:
                    0 8px 24px rgba(0, 0, 0, 0.35),
                    0 0 0 1px rgba(13, 71, 255, 0.08);
                position: relative;
                overflow: hidden;
            }

            /* Auth Logo */
            .auth-logo {
                text-align: center;
                margin-bottom: 32px;
                position: relative;
            }

            .auth-logo .logo-icon {
                font-size: 3.5rem;
                display: block;
                margin-bottom: 12px;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
                100% {
                    transform: scale(1);
                }
            }

            .auth-logo h1 {
                font-family: "Oswald", sans-serif;
                font-size: 2.2rem;
                font-weight: 700;
                color: var(--text);
                margin: 0 0 8px;
                letter-spacing: 1px;
                text-transform: uppercase;
                text-shadow: 0 0 10px rgba(13, 71, 255, 0.5);
            }

            .auth-logo p {
                color: var(--muted-text);
                font-size: 1.1rem;
                margin: 0;
                font-family: "Rajdhani", sans-serif;
                font-weight: 500;
            }

            /* Step Indicator */
            .step-indicator {
                display: flex;
                gap: 12px;
                justify-content: center;
                margin-bottom: 32px;
            }

            .step-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.15);
                transition: var(--transition);
            }

            .step-dot.done {
                background: var(--success-green);
                box-shadow: 0 0 8px rgba(0, 210, 106, 0.7);
            }

            .step-dot.active {
                background: var(--gold);
                box-shadow: 0 0 12px rgba(248, 198, 58, 0.9);
                transform: scale(1.2);
            }

            /* Form Group */
            .form-group {
                margin-bottom: 24px;
            }

            .form-group label {
                display: block;
                font-size: 0.9rem;
                font-weight: 600;
                color: var(--muted-text);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 10px;
                font-family: "Rajdhani", sans-serif;
            }

            .team-name-input {
                width: 100%;
                padding: 18px 20px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.07);
                border: 2px solid rgba(255, 255, 255, 0.12);
                color: var(--text);
                font-family: "Oswald", sans-serif;
                font-size: 1.5rem;
                font-weight: 600;
                text-align: center;
                outline: none;
                transition: var(--transition);
                box-sizing: border-box;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .team-name-input:focus {
                border-color: var(--primary-blue);
                background: rgba(13, 71, 255, 0.1);
                box-shadow: 0 0 15px rgba(13, 71, 255, 0.3);
            }

            .char-count {
                text-align: right;
                color: var(--muted-text);
                font-size: 0.9rem;
                margin-top: 8px;
                font-family: "Inter", sans-serif;
            }

            /* Submit Button */
            .submit-btn {
                width: 100%;
                padding: 18px;
                border-radius: 12px;
                border: none;
                cursor: pointer;
                background: linear-gradient(
                    135deg,
                    var(--primary-blue),
                    var(--secondary-purple)
                );
                color: var(--text);
                font-family: "Oswald", sans-serif;
                font-size: 1.2rem;
                font-weight: 700;
                letter-spacing: 1px;
                text-transform: uppercase;
                transition: var(--transition);
                box-shadow: var(--glow-blue);
                position: relative;
                overflow: hidden;
                margin-top: 10px;
            }

            .submit-btn::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent
                );
                transition: 0.5s;
            }

            .submit-btn:hover:not(:disabled) {
                opacity: 1;
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(13, 71, 255, 0.4);
            }

            .submit-btn:hover:not(:disabled)::before {
                left: 100%;
            }

            .submit-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            /* Alert */
            .alert {
                padding: 16px 20px;
                border-radius: 12px;
                margin-bottom: 24px;
                font-size: 1rem;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 12px;
                animation: fadeIn 0.3s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .alert-error {
                background: rgba(255, 61, 77, 0.15);
                border: 1px solid rgba(255, 61, 77, 0.3);
                color: #ff9aa4;
                box-shadow: var(--glow-red);
            }

            .alert-error::before {
                content: "⚠️";
            }

            /* Suggestions */
            .suggestions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 20px;
            }

            .suggestion-chip {
                padding: 10px 18px;
                border-radius: 20px;
                font-size: 0.95rem;
                font-weight: 600;
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.12);
                color: var(--muted-text);
                cursor: pointer;
                transition: var(--transition);
                font-family: "Rajdhani", sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .suggestion-chip:hover {
                background: rgba(13, 71, 255, 0.2);
                border-color: rgba(13, 71, 255, 0.4);
                color: var(--primary-blue);
                transform: translateY(-2px);
                box-shadow: 0 4px 10px rgba(13, 71, 255, 0.2);
            }

            /* Tip */
            .tip {
                color: var(--muted-text);
                font-size: 0.9rem;
                text-align: center;
                margin-top: 20px;
                font-family: "Inter", sans-serif;
            }

            /* Responsive */
            @media (max-width: 768px) {
                .auth-card {
                    padding: 30px 24px;
                    max-width: 420px;
                }

                .auth-logo h1 {
                    font-size: 1.8rem;
                }

                .team-name-input {
                    font-size: 1.3rem;
                    padding: 16px;
                }

                .submit-btn {
                    font-size: 1.1rem;
                    padding: 16px;
                }

                .step-indicator {
                    gap: 8px;
                    margin-bottom: 24px;
                }

                .step-dot {
                    width: 10px;
                    height: 10px;
                }
            }

            @media (max-width: 480px) {
                .auth-card {
                    padding: 24px 18px;
                }

                .auth-logo h1 {
                    font-size: 1.6rem;
                }

                .auth-logo p {
                    font-size: 0.9rem;
                }

                .team-name-input {
                    font-size: 1.1rem;
                    padding: 14px;
                }

                .suggestions {
                    gap: 8px;
                }

                .suggestion-chip {
                    padding: 8px 14px;
                    font-size: 0.85rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-logo">
                    <span class="logo-icon">🏆</span>
                    <h1>Fantasy SV</h1>
                    <p>Nombra a tu equipo.</p>
                </div>

                <div class="step-indicator">
                    <div class="step-dot done"></div>
                    <div class="step-dot done"></div>
                    <div class="step-dot active"></div>
                </div>

                <div
                    x-show="errorMsg"
                    class="alert alert-error"
                    x-text="errorMsg"
                ></div>

                <div>
                    <p
                        style="
                            color: var(--muted-text);
                            margin: 0 0 24px;
                            line-height: 1.6;
                            text-align: center;
                            font-size: 1.1rem;
                            font-family: &quot;Inter&quot;, sans-serif;
                        "
                    >
                        Cada equipo necesita un nombre legendario. Cual sera el
                        tuyo?
                    </p>

                    <div class="form-group">
                        <label>Team Name</label>
                        <input
                            type="text"
                            class="team-name-input"
                            x-model="teamName"
                            placeholder="e.g. Los Galácticos"
                            maxlength="50"
                            @keydown.enter="submit()"
                            autocomplete="off"
                        />
                        <div
                            class="char-count"
                            x-text="`${teamName.length}/50`"
                        ></div>
                    </div>

                    <!-- Quick suggestions -->
                    <div style="margin-bottom: 20px">
                        <div
                            style="
                                font-size: 0.85rem;
                                font-weight: 600;
                                color: var(--muted-text);
                                text-transform: uppercase;
                                letter-spacing: 0.08em;
                                margin-bottom: 12px;
                                font-family: &quot;Rajdhani&quot;, sans-serif;
                            "
                        >
                            Inspiracion
                        </div>
                        <div class="suggestions">
                            <template x-for="s in suggestions" :key="s">
                                <button
                                    class="suggestion-chip"
                                    @click="teamName = s"
                                    x-text="s"
                                ></button>
                            </template>
                        </div>
                    </div>

                    <button
                        class="submit-btn"
                        @click="submit()"
                        :disabled="loading || teamName.trim().length < 2"
                    >
                        <span
                            x-text="loading ? 'Guardando…' : 'Crea mi equipo →'"
                        ></span>
                    </button>
                    <p class="tip">
                        Puedes cambiar el nombre de tu equipo luego.
                    </p>
                </div>
            </div>
        </div>

        <script>
            function onboardingApp() {
                return {
                    teamName: "",
                    loading: false,
                    errorMsg: "",
                    suggestions: [
                        "Los Galácticos",
                        "The Untouchables",
                        "Penalty Kings",
                        "Thunder FC",
                        "The Underdogs",
                        "Chaos United",
                        "FC Barcelona Jr.",
                        "Red Rockets",
                        "Golden Boots",
                    ],

                    init() {
                        // Check if we have a JWT token
                        const token = localStorage.getItem("jwt_token");
                        if (!token) {
                            // If no token, redirect to login
                            window.location.href = "/login.html";
                        }
                    },

                    async submit() {
                        const name = this.teamName.trim();
                        if (name.length < 2 || name.length > 50) return;
                        this.loading = true;
                        this.errorMsg = "";

                        const token = localStorage.getItem("jwt_token");
                        try {
                            const resp = await fetch("/auth/onboarding", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Authorization: `Bearer ${token}`,
                                },
                                body: JSON.stringify({ team_name: name }),
                            });
                            const data = await resp.json();
                            if (resp.ok) {
                                // Onboarding complete — go to profile
                                window.location.href = "/profile";
                            } else {
                                this.errorMsg =
                                    data.detail ||
                                    "Could not save team name. Please try again.";
                            }
                        } catch (e) {
                            this.errorMsg =
                                "Network error. Please check your connection.";
                        } finally {
                            this.loading = false;
                        }
                    },
                };
            }
        </script>
    </body>
</html>
