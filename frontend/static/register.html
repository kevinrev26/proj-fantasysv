<!DOCTYPE html>
<html lang="en" x-data="registerApp()" x-init="init()">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Fantasy SV</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 60%, #1a2233 100%);
      padding: 24px 16px;
    }
    .auth-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .logo-icon { font-size: 2.8rem; display: block; margin-bottom: 8px; }
    .auth-logo h1 { font-size: 1.6rem; font-weight: 800; color: #fff; margin: 0 0 4px; }
    .auth-logo p { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 0; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; font-family: inherit; font-size: 1rem; outline: none;
      transition: border-color 0.2s, background 0.2s; box-sizing: border-box;
    }
    .form-group input:focus { border-color: #00d4aa; background: rgba(0,212,170,0.07); }
    .form-group input.error { border-color: #ff5f6d; }
    .field-error { color: #ff5f6d; font-size: 0.8rem; margin-top: 6px; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #00d4aa, #00a8e8);
      color: #fff; font-family: inherit; font-size: 1.05rem; font-weight: 800;
      letter-spacing: 0.02em; transition: opacity 0.2s, transform 0.1s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 24px; color: rgba(255,255,255,0.4); font-size: 0.88rem; }
    .auth-footer a { color: #00d4aa; text-decoration: none; font-weight: 700; }
    .alert { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; }
    .alert-error { background: rgba(255,95,109,0.15); border: 1px solid rgba(255,95,109,0.4); color: #ff9aa4; }
    .alert-success { background: rgba(0,212,170,0.15); border: 1px solid rgba(0,212,170,0.4); color: #00d4aa; }
    .step-indicator { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.2); transition: background 0.3s;
    }
    .step-dot.active { background: #00d4aa; }
    .step-dot.done { background: rgba(0,212,170,0.5); }
  </style>
</head>
<body style="margin:0;font-family:'Nunito',sans-serif;">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">⚽</span>
      <h1>Fantasy SV</h1>
      <p>Create your account — Step 1 of 3</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <!-- Error / success alerts -->
    <div x-show="errorMsg" class="alert alert-error" x-text="errorMsg"></div>
    <div x-show="successMsg" class="alert alert-success" x-text="successMsg"></div>

    <!-- Registration form -->
    <template x-if="!registered">
      <div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" x-model="form.username" :class="fieldErrors.username ? 'error' : ''"
                 placeholder="your_username" @input="clearError('username')" autocomplete="username"/>
          <div x-show="fieldErrors.username" class="field-error" x-text="fieldErrors.username"></div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" x-model="form.email" :class="fieldErrors.email ? 'error' : ''"
                 placeholder="you@example.com" @input="clearError('email')" autocomplete="email"/>
          <div x-show="fieldErrors.email" class="field-error" x-text="fieldErrors.email"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" x-model="form.password" :class="fieldErrors.password ? 'error' : ''"
                 placeholder="Min. 8 characters" @input="clearError('password')" autocomplete="new-password"/>
          <div x-show="fieldErrors.password" class="field-error" x-text="fieldErrors.password"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" x-model="form.confirmPassword" :class="fieldErrors.confirmPassword ? 'error' : ''"
                 placeholder="Repeat password" @keydown.enter="submit()" autocomplete="new-password"/>
          <div x-show="fieldErrors.confirmPassword" class="field-error" x-text="fieldErrors.confirmPassword"></div>
        </div>
        <button class="submit-btn" @click="submit()" :disabled="loading">
          <span x-text="loading ? 'Creating account…' : 'Create Account →'"></span>
        </button>
      </div>
    </template>

    <!-- Post-registration state: waiting for activation -->
    <template x-if="registered">
      <div style="text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">📬</div>
        <h2 style="color:#fff;margin:0 0 12px;">Check your email!</h2>
        <p style="color:rgba(255,255,255,0.55);line-height:1.6;margin:0 0 20px;">
          We sent an activation link to <strong style="color:#00d4aa;" x-text="form.email"></strong>.
          Click the link in the email to activate your account and continue.
        </p>
        <p style="color:rgba(255,255,255,0.35);font-size:0.82rem;">
          💡 For development: check the backend server logs for the activation token/URL.
        </p>
        <a href="/activate" style="display:inline-block;margin-top:16px;padding:12px 28px;background:rgba(0,212,170,0.15);border:1px solid rgba(0,212,170,0.4);border-radius:10px;color:#00d4aa;font-weight:700;text-decoration:none;">
          I have my activation code →
        </a>
      </div>
    </template>

    <div class="auth-footer">
      Already have an account? <a href="/squad-builder.html">Sign in</a>
    </div>
  </div>
</div>

<script>
function registerApp() {
  return {
    form: { username: '', email: '', password: '', confirmPassword: '' },
    fieldErrors: {},
    errorMsg: '',
    successMsg: '',
    loading: false,
    registered: false,

    init() {},

    clearError(field) {
      this.fieldErrors[field] = '';
      this.errorMsg = '';
    },

    validate() {
      this.fieldErrors = {};
      let valid = true;
      if (!this.form.username || this.form.username.trim().length < 2) {
        this.fieldErrors.username = 'Username must be at least 2 characters';
        valid = false;
      }
      if (!this.form.email || !this.form.email.includes('@')) {
        this.fieldErrors.email = 'Please enter a valid email';
        valid = false;
      }
      if (!this.form.password || this.form.password.length < 8) {
        this.fieldErrors.password = 'Password must be at least 8 characters';
        valid = false;
      }
      if (this.form.password !== this.form.confirmPassword) {
        this.fieldErrors.confirmPassword = 'Passwords do not match';
        valid = false;
      }
      return valid;
    },

    async submit() {
      if (!this.validate()) return;
      this.loading = true;
      this.errorMsg = '';
      try {
        const resp = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: this.form.username.trim(),
            email: this.form.email.trim().toLowerCase(),
            password: this.form.password,
          })
        });
        const data = await resp.json();
        if (resp.ok) {
          this.registered = true;
        } else {
          this.errorMsg = data.detail || 'Registration failed. Please try again.';
        }
      } catch (e) {
        this.errorMsg = 'Network error. Please try again.';
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
