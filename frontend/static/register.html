<!DOCTYPE html>
<html lang="es" x-data="registerApp()" x-init="init()">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro — Fantasy SV</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Rajdhani', 'Archivo', sans-serif;
      background: linear-gradient(135deg, #0B1020 0%, #151C32 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background elements */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(13, 71, 255, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 255, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(0, 210, 106, 0.1) 0%, transparent 30%);
      z-index: -1;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      width: 100%;
    }

    .auth-card {
      background: rgba(21, 28, 50, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 
        0 0 30px rgba(13, 71, 255, 0.2),
        0 0 60px rgba(123, 44, 255, 0.1);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(13, 71, 255, 0.1) 0%, rgba(123, 44, 255, 0.1) 100%);
      z-index: -1;
      border-radius: 20px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .auth-logo .logo-icon { 
      font-size: 3.5rem; 
      display: block; 
      margin-bottom: 12px;
      background: linear-gradient(135deg, #0D47FF, #7B2CFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(13, 71, 255, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { text-shadow: 0 0 15px rgba(13, 71, 255, 0.5); }
      50% { text-shadow: 0 0 25px rgba(13, 71, 255, 0.8), 0 0 35px rgba(123, 44, 255, 0.6); }
      100% { text-shadow: 0 0 15px rgba(13, 71, 255, 0.5); }
    }

    .auth-logo h1 { 
      font-family: 'Oswald', 'Inter', sans-serif;
      font-size: 2.2rem; 
      font-weight: 700; 
      color: #fff; 
      margin: 0 0 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #0D47FF, #00D26A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(13, 71, 255, 0.3);
    }

    .auth-logo p { 
      color: #A6B0C3; 
      font-size: 1rem; 
      margin: 0;
      font-weight: 500;
    }

    .form-group { 
      margin-bottom: 24px; 
    }

    .form-group label { 
      display: block; 
      font-size: 0.9rem; 
      font-weight: 600; 
      color: #A6B0C3; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-bottom: 8px;
      font-family: 'Rajdhani', sans-serif;
    }

    .form-group input {
      width: 100%; 
      padding: 14px 16px; 
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07); 
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff; 
      font-family: 'Inter', sans-serif; 
      font-size: 1rem; 
      outline: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(13, 71, 255, 0);
    }

    .form-group input:focus { 
      border-color: #0D47FF; 
      background: rgba(13, 71, 255, 0.1); 
      box-shadow: 0 0 0 1px #0D47FF, 0 0 20px rgba(13, 71, 255, 0.3);
    }

    .form-group input.error { 
      border-color: #FF3D4D; 
      box-shadow: 0 0 0 1px #FF3D4D, 0 0 15px rgba(255, 61, 77, 0.3);
    }

    .field-error { 
      color: #FF3D4D; 
      font-size: 0.85rem; 
      margin-top: 6px; 
      font-family: 'Inter', sans-serif;
    }

    .submit-btn {
      width: 100%; 
      padding: 16px; 
      border-radius: 12px; 
      border: none; 
      cursor: pointer;
      background: linear-gradient(135deg, #0D47FF, #7B2CFF);
      color: #fff; 
      font-family: 'Inter', 'Rajdhani', sans-serif;
      font-size: 1.1rem; 
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 
        0 0 20px rgba(13, 71, 255, 0.4),
        0 0 30px rgba(123, 44, 255, 0.3);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-top: 10px;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 
        0 0 25px rgba(13, 71, 255, 0.6),
        0 0 40px rgba(123, 44, 255, 0.4);
    }

    .submit-btn:hover:not(:disabled)::before {
      left: 100%;
    }

    .submit-btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      transform: none;
      box-shadow: 0 0 15px rgba(13, 71, 255, 0.2);
    }

    .auth-footer { 
      text-align: center; 
      margin-top: 28px; 
      color: #A6B0C3; 
      font-size: 0.9rem; 
      font-weight: 400;
      font-family: 'Inter', sans-serif;
    }

    .auth-footer a { 
      color: #00D26A; 
      text-decoration: none; 
      font-weight: 600; 
      position: relative;
      transition: all 0.3s;
    }

    .auth-footer a::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #00D26A;
      transition: width 0.3s;
    }

    .auth-footer a:hover::after {
      width: 100%;
    }

    .alert { 
      padding: 16px 20px; 
      border-radius: 12px; 
      margin-bottom: 24px; 
      font-size: 0.95rem; 
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error { 
      background: rgba(255, 61, 77, 0.15); 
      border: 1px solid rgba(255, 61, 77, 0.4); 
      color: #FF9AA4; 
    }

    .alert-success { 
      background: rgba(0, 210, 106, 0.15); 
      border: 1px solid rgba(0, 210, 106, 0.4); 
      color: #00D26A; 
    }

    .step-indicator { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      margin-bottom: 32px; 
    }

    .step-dot {
      width: 12px; 
      height: 12px; 
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); 
      transition: all 0.3s ease;
      position: relative;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
    }

    .step-dot.active { 
      background: #0D47FF; 
      box-shadow: 0 0 10px rgba(13, 71, 255, 0.6);
      transform: scale(1.2);
    }

    .step-dot.done { 
      background: rgba(0, 210, 106, 0.5); 
      box-shadow: 0 0 10px rgba(0, 210, 106, 0.4);
    }

    .step-dot.active::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }

    /* Post-registration state */
    .post-registration {
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.5s ease-out;
    }

    .post-registration .emoji {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .post-registration h2 {
      font-family: 'Oswald', 'Inter', sans-serif;
      font-size: 1.8rem;
      color: #fff;
      margin: 0 0 15px;
      position: relative;
      display: inline-block;
    }

    .post-registration h2::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(135deg, #0D47FF, #00D26A);
      border-radius: 3px;
    }

    .post-registration p {
      color: #A6B0C3;
      line-height: 1.6;
      margin: 0 0 25px;
      font-size: 1.05rem;
      font-weight: 400;
    }

    .post-registration strong {
      color: #00D26A;
      font-weight: 600;
    }

    .post-registration .info-note {
      background: rgba(13, 71, 255, 0.1);
      border: 1px solid rgba(13, 71, 255, 0.2);
      border-radius: 12px;
      padding: 15px 20px;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #A6B0C3;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .post-registration .info-note svg {
      width: 20px;
      height: 20px;
      color: #0D47FF;
    }

    .activation-link {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: rgba(0, 210, 106, 0.15);
      border: 1px solid rgba(0, 210, 106, 0.4);
      border-radius: 12px;
      color: #00D26A;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .activation-link::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: 0.5s;
    }

    .activation-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 210, 106, 0.3);
    }

    .activation-link:hover::before {
      left: 100%;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 20px;
      }
      
      .auth-logo h1 {
        font-size: 1.8rem;
      }
      
      .auth-logo .logo-icon {
        font-size: 2.5rem;
      }
      
      .step-indicator {
        margin-bottom: 24px;
      }
      
      .step-dot {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">⚽</span>
      <h1>Fantasy SV</h1>
      <p>Crea tu cuenta — Paso 1 de 3</p>
    </div>

    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <!-- Error / success alerts -->
    <div x-show="errorMsg" class="alert alert-error" x-text="errorMsg"></div>
    <div x-show="successMsg" class="alert alert-success" x-text="successMsg"></div>

    <!-- Registration form -->
    <template x-if="!registered">
      <div>
        <div class="form-group">
          <label>Nombre de Usuario</label>
          <input type="text" x-model="form.username" :class="fieldErrors.username ? 'error' : ''"
                 placeholder="tu_usuario" @input="clearError('username')" autocomplete="username"/>
          <div x-show="fieldErrors.username" class="field-error" x-text="fieldErrors.username"></div>
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" x-model="form.email" :class="fieldErrors.email ? 'error' : ''"
                 placeholder="tu@ejemplo.com" @input="clearError('email')" autocomplete="email"/>
          <div x-show="fieldErrors.email" class="field-error" x-text="fieldErrors.email"></div>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" x-model="form.password" :class="fieldErrors.password ? 'error' : ''"
                 placeholder="Mínimo 8 caracteres" @input="clearError('password')" autocomplete="new-password"/>
          <div x-show="fieldErrors.password" class="field-error" x-text="fieldErrors.password"></div>
        </div>
        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input type="password" x-model="form.confirmPassword" :class="fieldErrors.confirmPassword ? 'error' : ''"
                 placeholder="Repetir contraseña" @keydown.enter="submit()" autocomplete="new-password"/>
          <div x-show="fieldErrors.confirmPassword" class="field-error" x-text="fieldErrors.confirmPassword"></div>
        </div>
        <button class="submit-btn" @click="submit()" :disabled="loading">
          <span x-text="loading ? 'Creando cuenta…' : 'Crear Cuenta →'"></span>
        </button>
      </div>
    </template>

    <!-- Post-registration state: waiting for activation -->
    <template x-if="registered">
      <div class="post-registration">
        <div class="emoji">📬</div>
        <h2>¡Revisa tu correo!</h2>
        <p>Hemos enviado un enlace de activación a <strong x-text="form.email"></strong>. Haz clic en el enlace del correo para activar tu cuenta y continuar.</p>
        <div class="info-note">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>💡 Para desarrollo: revisa los registros del servidor backend para el token/URL de activación.</span>
        </div>
        <a href="/activate" class="activation-link">
          Tengo mi código de activación →
        </a>
      </div>
    </template>

    <div class="auth-footer">
      ¿Ya tienes una cuenta? <a href="/squad-builder.html">Iniciar sesión</a>
    </div>
  </div>
</div>

<script>
function registerApp() {
  return {
    form: { username: '', email: '', password: '', confirmPassword: '' },
    fieldErrors: {},
    errorMsg: '',
    successMsg: '',
    loading: false,
    registered: false,

    init() {},

    clearError(field) {
      this.fieldErrors[field] = '';
      this.errorMsg = '';
    },

    validate() {
      this.fieldErrors = {};
      let valid = true;
      if (!this.form.username || this.form.username.trim().length < 2) {
        this.fieldErrors.username = 'El nombre de usuario debe tener al menos 2 caracteres';
        valid = false;
      }
      if (!this.form.email || !this.form.email.includes('@')) {
        this.fieldErrors.email = 'Por favor ingresa un correo válido';
        valid = false;
      }
      if (!this.form.password || this.form.password.length < 8) {
        this.fieldErrors.password = 'La contraseña debe tener al menos 8 caracteres';
        valid = false;
      }
      if (this.form.password !== this.form.confirmPassword) {
        this.fieldErrors.confirmPassword = 'Las contraseñas no coinciden';
        valid = false;
      }
      return valid;
    },

    async submit() {
      if (!this.validate()) return;
      this.loading = true;
      this.errorMsg = '';
      try {
        const resp = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: this.form.username.trim(),
            email: this.form.email.trim().toLowerCase(),
            password: this.form.password,
          })
        });
        const data = await resp.json();
        if (resp.ok) {
          // Immediately call login with same credentials
          const loginResp = await fetch('/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              username: this.form.username.trim(),
              password: this.form.password,
            })
          });
          
          if (loginResp.ok) {
            const loginData = await loginResp.json();
            // Store JWT token
            localStorage.setItem('jwt_token', loginData.access_token);
            // Redirect to onboarding
            window.location.href = '/onboarding.html';
          } else {
            const errorData = await loginResp.json();
            this.errorMsg = errorData.detail || 'Error en el inicio de sesión';
          }
        } else {
          this.errorMsg = data.detail || 'El registro falló. Por favor inténtalo de nuevo.';
        }
      } catch (e) {
        this.errorMsg = 'Error de red. Por favor inténtalo de nuevo.';
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
