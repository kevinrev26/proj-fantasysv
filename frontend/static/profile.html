<!DOCTYPE html>
<html lang="en" x-data="profileApp()" x-init="init()">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — Fantasy SV</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <style>
    /* Rebranded Design Tokens */
    :root {
      /* Color Palette */
      --primary-blue: #0D47FF;
      --secondary-purple: #7B2CFF;
      --success-green: #00D26A;
      --danger-red: #FF3D4D;
      --gold: #F8C63A;
      --background-dark: #0B1020;
      --surface-dark: #151C32;
      --text-white: #FFFFFF;
      --text-muted: #A6B0C3;
      
      /* Typography */
      --font-primary: 'Inter', sans-serif;
      --font-heading: 'Rajdhani', sans-serif;
      --font-display: 'Oswald', sans-serif;
      --font-mono: 'Archivo', monospace;
      
      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      
      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      
      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow-blue: 0 0 12px rgba(13, 71, 255, 0.5);
      --shadow-glow-purple: 0 0 12px rgba(123, 44, 255, 0.5);
      --shadow-glow-green: 0 0 12px rgba(0, 210, 106, 0.5);
      
      /* Transitions */
      --transition-fast: 0.2s ease;
      --transition-medium: 0.3s ease;
      --transition-slow: 0.4s ease;
    }
    
    /* Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-primary);
      background: var(--background-dark);
      color: var(--text-white);
      min-height: 100dvh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(13, 71, 255, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(123, 44, 255, 0.1) 0%, transparent 20%),
        linear-gradient(to bottom, var(--background-dark), #080b14);
      background-attachment: fixed;
    }
    
    button {
      font-family: var(--font-primary);
      cursor: pointer;
      border: none;
      background: none;
      transition: var(--transition-medium);
    }
    
    /* Main Navigation */
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 16, 32, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.02em;
      transition: transform 0.2s;
      position: relative;
    }
    
    .nav-brand:hover {
      transform: scale(1.02);
      text-shadow: 0 0 10px rgba(13, 71, 255, 0.7);
    }
    
    .nav-logo-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px rgba(13, 71, 255, 0.7));
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    
    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      position: relative;
      padding: 6px 0;
      letter-spacing: 0.02em;
    }
    
    .nav-link:hover {
      color: var(--primary-blue);
    }
    
    .nav-link::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--primary-blue);
      transition: width 0.3s ease;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(13, 71, 255, 0.5);
    }
    
    .nav-link:hover::after {
      width: 100%;
    }
    
    .nav-link.active {
      color: var(--primary-blue);
      font-weight: 700;
    }
    
    .nav-link.active::after {
      width: 100%;
      background: var(--primary-blue);
      box-shadow: 0 0 10px rgba(13, 71, 255, 0.7);
    }
    
    .sign-out-btn {
      background: rgba(255, 95, 109, 0.15);
      color: var(--danger-red);
      border: 1px solid rgba(255, 95, 109, 0.3);
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .sign-out-btn:hover {
      background: var(--danger-red);
      color: var(--text-white);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 95, 109, 0.3);
      animation: pulse 1.5s infinite;
    }
    
    .nav-mobile-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 5px;
    }
    
    .nav-mobile-toggle span {
      width: 24px;
      height: 2px;
      background: var(--text-white);
      border-radius: 2px;
      transition: 0.3s;
    }
    
    @media (max-width: 768px) {
      .nav-mobile-toggle {
        display: flex;
      }
      
      .nav-links {
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        background: rgba(15, 32, 64, 0.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        padding: 20px;
        gap: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      }
      
      .nav-links.active {
        transform: translateY(0);
        opacity: 1;
        pointer-events: all;
      }
    }
    
    /* Profile Page */
    .profile-page {
      max-width: 520px;
      margin: 0 auto;
      padding: var(--spacing-lg) var(--spacing-md) var(--spacing-2xl);
      position: relative;
      overflow: hidden;
    }
    
    .profile-page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 15% 25%, rgba(13, 71, 255, 0.05) 0%, transparent 25%),
        radial-gradient(circle at 85% 75%, rgba(123, 44, 255, 0.05) 0%, transparent 25%);
      z-index: -1;
    }
    
    /* Profile Card */
    .profile-card {
      background: rgba(21, 28, 50, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      margin-bottom: var(--spacing-lg);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border-color: rgba(13, 71, 255, 0.3);
    }
    
    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-blue), var(--secondary-purple));
      animation: glow 2s infinite;
    }
    
    @keyframes glow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    
    /* Profile Avatar */
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-blue), var(--secondary-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto var(--spacing-md);
      box-shadow: 0 0 20px rgba(13, 71, 255, 0.3);
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    
    .profile-avatar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      animation: shine 3s infinite;
    }
    
    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    /* Profile Name */
    .profile-name {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-white);
      margin: 0 0 var(--spacing-xs);
      font-family: var(--font-heading);
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(13, 71, 255, 0.3);
    }
    
    /* Profile Email */
    .profile-email {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 var(--spacing-lg);
      font-weight: 500;
    }
    
    /* Profile Badges */
    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 auto var(--spacing-lg);
      display: block;
      width: fit-content;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    
    .badge-active {
      background: rgba(0, 210, 106, 0.15);
      border: 1px solid rgba(0, 210, 106, 0.4);
      color: var(--success-green);
      box-shadow: 0 0 15px rgba(0, 210, 106, 0.2);
    }
    
    .badge-inactive {
      background: rgba(255, 61, 77, 0.15);
      border: 1px solid rgba(255, 61, 77, 0.4);
      color: var(--danger-red);
      box-shadow: 0 0 15px rgba(255, 61, 77, 0.2);
    }
    
    .badge-admin {
      background: rgba(248, 198, 58, 0.15);
      border: 1px solid rgba(248, 198, 58, 0.4);
      color: var(--gold);
      box-shadow: 0 0 15px rgba(248, 198, 58, 0.2);
    }
    
    /* Section Title */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0 0 var(--spacing-lg);
      position: relative;
      padding-bottom: 8px;
    }
    
    .section-title::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 2px;
      background: var(--primary-blue);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(13, 71, 255, 0.5);
    }
    
    /* Form Group */
    .form-group {
      margin-bottom: var(--spacing-lg);
    }
    
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-white);
      margin-bottom: var(--spacing-xs);
      letter-spacing: 0.02em;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-white);
      font-family: var(--font-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition-medium);
      box-sizing: border-box;
      font-weight: 500;
    }
    
    .form-input:focus {
      border-color: var(--primary-blue);
      background: rgba(13, 71, 255, 0.1);
      box-shadow: 0 0 10px rgba(13, 71, 255, 0.3);
    }
    
    /* Buttons */
    .btn {
      padding: 14px 24px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      font-family: var(--font-primary);
      font-size: 1rem;
      font-weight: 700;
      transition: var(--transition-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }
    
    .btn:hover::after {
      transform: translateX(100%);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-blue), var(--secondary-purple));
      color: var(--text-white);
      position: relative;
      overflow: hidden;
      z-index: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(13, 71, 255, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    
    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-white);
      font-weight: 600;
    }
    
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    
    .btn-danger {
      background: rgba(255, 61, 77, 0.15);
      border: 1px solid rgba(255, 61, 77, 0.4);
      color: var(--danger-red);
      font-weight: 700;
    }
    
    .btn-danger:hover {
      background: rgba(255, 61, 77, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(255, 61, 77, 0.3);
    }
    
    /* Alert */
    .alert {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-lg);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .alert-success {
      background: rgba(0, 210, 106, 0.15);
      border: 1px solid rgba(0, 210, 106, 0.4);
      color: var(--success-green);
      box-shadow: 0 0 15px rgba(0, 210, 106, 0.2);
    }
    
    .alert-error {
      background: rgba(255, 61, 77, 0.15);
      border: 1px solid rgba(255, 61, 77, 0.4);
      color: var(--danger-red);
      box-shadow: 0 0 15px rgba(255, 61, 77, 0.2);
    }
    
    /* Stats Grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }
    
    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }
    
    .stat-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      border-color: rgba(13, 71, 255, 0.3);
    }
    
    .stat-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-blue), var(--secondary-purple));
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-white);
      font-family: var(--font-display);
      letter-spacing: 1px;
      margin-bottom: var(--spacing-xs);
      text-shadow: 0 0 10px rgba(13, 71, 255, 0.3);
    }
    
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    
    /* Skeleton */
    .skeleton {
      background: rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-md);
      height: 20px;
      animation: pulse 1.5s ease-in-out infinite;
      width: 100%;
    }
    
    .skeleton.avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto var(--spacing-md);
    }
    
    .skeleton.name {
      width: 60%;
      height: 24px;
      margin: 0 auto 12px;
    }
    
    .skeleton.email {
      width: 40%;
      height: 18px;
      margin: 0 auto 20px;
    }
    
    .skeleton.badge {
      width: 100px;
      height: 28px;
      margin: 0 auto 16px;
    }
    
    .skeleton.stat {
      width: 100%;
      height: 60px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .profile-page {
        padding: var(--spacing-md) var(--spacing-sm) var(--spacing-2xl);
      }
      
      .profile-card {
        padding: var(--spacing-lg);
      }
      
      .stat-grid {
        grid-template-columns: 1fr;
        gap: var(--spacing-md);
      }
      
      .stat-box {
        padding: var(--spacing-md);
      }
      
      .stat-value {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<nav class="main-nav">
  <div class="nav-container">
    <a href="/" class="nav-brand"><span class="nav-logo-icon">⚽</span> Fantasy SV</a>
    <button class="nav-mobile-toggle" onclick="document.getElementById('nav-links').classList.toggle('active')">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="/squad-builder" class="nav-link">Mi Equipo</a>
      <a href="/schedule" class="nav-link">Calendario</a>
      <a href="/predictor" class="nav-link active">Predicciones</a>
      <a href="/leaderboard" class="nav-link">Clasificación</a>
      <a href="/profile" class="nav-link">Perfil</a>
      <a href="/leagues" class="nav-link">Ligas Privadas</a>
      <span id="nav-auth"></span>
    </div>
  </div>
</nav>

<div class="profile-page">

  <!-- Loading skeleton -->
  <template x-if="loading">
    <div class="profile-card">
      <div class="skeleton avatar"></div>
      <div class="skeleton name"></div>
      <div class="skeleton email"></div>
      <div class="skeleton badge"></div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="skeleton stat"></div>
        </div>
        <div class="stat-box">
          <div class="skeleton stat"></div>
        </div>
        <div class="stat-box">
          <div class="skeleton stat"></div>
        </div>
        <div class="stat-box">
          <div class="skeleton stat"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- Profile card -->
  <template x-if="!loading && user">
    <div>
      <!-- Identity card -->
      <div class="profile-card">
        <div class="profile-avatar" x-text="user.username ? user.username[0].toUpperCase() : '?'"></div>
        <h1 class="profile-name" x-text="user.username"></h1>
        <p class="profile-email" x-text="user.email"></p>
        <div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <span class="profile-badge" :class="user.is_active ? 'badge-active' : 'badge-inactive'"
                x-text="user.is_active ? '✓ Active' : '⚠ Not Activated'"></span>
          <span x-show="user.role === 'admin'" class="profile-badge badge-admin">⭐ Admin</span>
        </div>
      </div>

      <!-- Stats card -->
      <div class="profile-card">
        <div class="section-title">Season Stats</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-value" x-text="stats.totalPoints ?? '—'"></div>
            <div class="stat-label">Total Points</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" x-text="stats.rank ? '#' + stats.rank : '—'"></div>
            <div class="stat-label">Ranking</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" x-text="stats.teamName ?? '—'"></div>
            <div class="stat-label">Team Name</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" x-text="stats.matchdayPoints ?? '—'"></div>
            <div class="stat-label">Last GW</div>
          </div>
        </div>
      </div>

      <!-- Edit team name -->
      <div class="profile-card">
        <div class="section-title">Edit Team Name</div>
        <div x-show="teamNameMsg" class="alert" :class="teamNameSuccess ? 'alert-success' : 'alert-error'" x-text="teamNameMsg"></div>
        <div class="form-group">
          <label>Team Name</label>
          <input type="text" class="form-input" x-model="editTeamName" maxlength="50"
                 placeholder="Your team name" @keydown.enter="saveTeamName()"/>
        </div>
        <button class="btn btn-primary" @click="saveTeamName()" :disabled="savingTeamName || editTeamName.trim().length < 2">
          <span x-text="savingTeamName ? 'Saving…' : 'Save Team Name'"></span>
        </button>
      </div>

      <!-- Sign out / danger zone -->
      <div class="profile-card">
        <div class="section-title">Account</div>
        <button class="btn btn-danger" style="width:100%;" @click="signOut()">Sign Out</button>
      </div>
    </div>
  </template>

  <!-- Error state -->
  <template x-if="!loading && !user">
    <div class="profile-card" style="text-align:center;">
      <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
      <p style="color:rgba(255,255,255,0.5);">Could not load profile. <a href="/register" style="color:#00d4aa;">Register</a> or check your connection.</p>
    </div>
  </template>

</div>

<script>
// Add role requirement at the top
if (!requireRole('user')) {
  // If requireRole returns false, it already redirected to login
  // So we don't need to do anything here
}

function profileApp() {
  return {
    user: null,
    loading: true,
    stats: { totalPoints: null, rank: null, teamName: null, matchdayPoints: null },
    editTeamName: '',
    savingTeamName: false,
    teamNameMsg: '',
    teamNameSuccess: false,

    async init() {
      await requireRole('user')
      setupNavAuth();
      await this.loadProfile();
      await this.loadLeaderboard();
    },

    async loadProfile() {
      this.loading = true;
      try {
        // Replace fetch with authFetch
        const resp = await authFetch('/auth/me');
        if (resp.ok) {
          this.user = await resp.json();
        }
      } catch (e) {
        console.warn('Failed to load profile', e);
      } finally {
        this.loading = false;
      }
    },

    async loadLeaderboard() {
      try {
        // Replace fetch with authFetch
        const resp = await authFetch('/squad/leaderboard');
        if (resp.ok) {
          const data = await resp.json();
          const myEntry = data.leaderboard?.find(e => e.is_current_user);
          if (myEntry) {
            this.stats.totalPoints = myEntry.total_points;
            this.stats.rank = myEntry.rank;
            this.stats.teamName = myEntry.name;
            this.stats.matchdayPoints = myEntry.matchday_points;
            this.editTeamName = myEntry.name;
          }
        }
      } catch (e) {
        console.warn('Failed to load leaderboard', e);
      }
    },

    async saveTeamName() {
      const name = this.editTeamName.trim();
      if (name.length < 2) return;
      this.savingTeamName = true;
      this.teamNameMsg = '';
      try {
        // Replace fetch with authFetch
        const resp = await authFetch('/auth/onboarding/team-name', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ team_name: name })
        });
        const data = await resp.json();
        if (resp.ok) {
          this.teamNameMsg = '✓ Team name updated!';
          this.teamNameSuccess = true;
          this.stats.teamName = name;
        } else {
          this.teamNameMsg = data.detail || 'Failed to update team name.';
          this.teamNameSuccess = false;
        }
      } catch (e) {
        this.teamNameMsg = 'Network error.';
        this.teamNameSuccess = false;
      } finally {
        this.savingTeamName = false;
        setTimeout(() => { this.teamNameMsg = ''; }, 3000);
      }
    },

    signOut() {
      logout();
    }
  };
}
</script>
</body>
</html>
