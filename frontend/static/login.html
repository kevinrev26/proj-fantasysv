<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Iniciar Sesión — EA FC Fantasy</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* ========== GLOBAL & VARIABLES (same aesthetic as squad builder) ========== */
    :root {
      --navy:        #0a1628;
      --navy-mid:    #0f2040;
      --navy-light:  #162a50;
      --navy-card:   #1a3260;
      --teal:        #00d4aa;
      --teal-dark:   #00a88a;
      --teal-glow:   rgba(0, 212, 170, 0.25);
      --gold:        #f5c842;
      --gold-dark:   #d4a800;
      --blue-accent: #00a8e8;
      --red-accent:  #ff5f6d;
      --orange:      #ff9f43;
      --text-white:  #ffffff;
      --text-dim:    rgba(255,255,255,0.55);
      --text-muted:  rgba(255,255,255,0.3);
      --radius:      14px;
      --radius-sm:   8px;
      --shadow-card: 0 8px 32px rgba(0,0,0,0.45);
      --font: 'Nunito', sans-serif;
    }
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--navy);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* header (compact) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10,22,40,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon { font-size: 1.5rem; }
    .logo-label {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-link.active {
      color: var(--teal);
      border-bottom: 2px solid var(--teal);
      padding-bottom: 4px;
    }
    .nav-link:hover { color: var(--teal); }

    /* main container */
    .login-container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--navy-mid);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 2rem;
      box-shadow: var(--shadow-card);
    }
    .login-title {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-title h1 {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--teal), var(--blue-accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .login-title p {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-dim);
    }
    .form-input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-sm);
      color: var(--text-white);
      font-family: var(--font);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--teal);
    }
    .btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--teal);
      color: var(--navy);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--teal-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--teal-glow);
    }
    .btn:active {
      transform: translateY(0);
    }
    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-dim);
      font-weight: 600;
    }
    .register-link a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 700;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .error-message {
      color: var(--red-accent);
      font-weight: 600;
      margin-top: 0.5rem;
      text-align: center;
    }
    .success-message {
      color: var(--teal);
      font-weight: 600;
      margin-top: 0.5rem;
      text-align: center;
    }

    /* mobile */
    @media (max-width: 680px) {
      .login-container {
        padding: 1rem;
        margin: 1rem auto;
      }
      .login-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- ── MAIN NAVIGATION ── -->
  <nav class="main-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <span class="nav-logo-icon">⚽</span>
        Fantasy SV
      </a>
      
      <button class="nav-mobile-toggle" onclick="document.getElementById('nav-links').classList.toggle('active')">
        <span></span><span></span><span></span>
      </button>

      <div class="nav-links" id="nav-links">
        <a href="squad-builder.html" class="nav-link">Mi Equipo</a>
        <a href="leaderboard.html" class="nav-link">Clasificación</a>
        <a href="profile.html" class="nav-link">Perfil</a>
        <button class="sign-out-btn">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <main x-data="loginApp()">
    <div class="login-container">
      <div class="login-card">
        <div class="login-title">
          <h1>🔐 Iniciar Sesión</h1>
          <p>Accede a tu cuenta de Fantasy</p>
        </div>
        
        <form @submit.prevent="handleLogin" class="login-form">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              x-model="email" 
              required
            >
          </div>
          
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              x-model="password" 
              required
            >
          </div>
          
          <button type="submit" class="btn">Iniciar Sesión</button>
          
          <div class="error-message" x-show="error" x-text="error"></div>
          <div class="success-message" x-show="success" x-text="success"></div>
        </form>
        
        <div class="register-link">
          ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    function loginApp() {
      return {
        email: '',
        password: '',
        error: '',
        success: '',
        
        handleLogin() {
          // Simple validation
          if (!this.email || !this.password) {
            this.error = 'Por favor completa todos los campos';
            return;
          }
          
          // Make actual API call
          fetch('/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              username: this.email,
              password: this.password
            })
          })
          .then(response => {
            if (!response.ok) {
              throw new Error('Credenciales inválidas');
            }
            return response.json();
          })
          .then(data => {
            // Store JWT token
            localStorage.setItem('jwt_token', data.access_token);
            
            // Check if onboarding is complete
            fetch('/auth/me', {
              headers: {
                'Authorization': `Bearer ${data.access_token}`
              }
            })
            .then(response => response.json())
              .then(user => {
                console.log(user)
                if (user.onboarding_complete === false) {
                  console.log("REDIREC TO ONBOARDING")
                  window.location.href = '/onboarding';
                } else if (user.role === 'admin') {
                  console.log("REDIREC TO ADMIN DASHBOARD")
                  window.location.href = '/admin-dashboard';
                } else {
                  console.log("REDIREC TO SQUAD BUILDER")
                  window.location.href = '/squad-builder';
                }
              });
          })
          .catch(error => {
            this.error = 'Credenciales inválidas';
            this.success = '';
          });
        }
      }
    }
  </script>
</body>
</html>
