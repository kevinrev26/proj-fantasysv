<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Iniciar Sesión — EA FC Fantasy</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script src="/js/auth.js"></script>
        <script src="/js/nav.js"></script>
        <style>
            /* ========== GLOBAL & VARIABLES ========== */
            :root {
                --primary-blue: #0d47ff;
                --secondary-purple: #7b2cff;
                --success-green: #00d26a;
                --danger-red: #ff3d4d;
                --gold: #f8c63a;
                --background-dark: #0b1020;
                --surface-dark: #151c32;
                --text-white: #ffffff;
                --text-muted: #a6b0c3;
                --radius: 16px;
                --radius-sm: 12px;
                --shadow-card: 0 12px 40px rgba(13, 71, 255, 0.25);
                --shadow-glow: 0 0 20px rgba(13, 71, 255, 0.5);
                --font-primary: "Inter", sans-serif;
                --font-heading: "Oswald", sans-serif;
                --font-display: "Rajdhani", sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: var(--font-primary);
                background: var(--background-dark);
                color: var(--text-white);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                background-image:
                    radial-gradient(
                        circle at 10% 20%,
                        rgba(13, 71, 255, 0.06) 0%,
                        transparent 25%
                    ),
                    radial-gradient(
                        circle at 90% 80%,
                        rgba(123, 44, 255, 0.04) 0%,
                        transparent 25%
                    ),
                    linear-gradient(135deg, #0b1020 0%, #0b1020 100%);
            }
            .main-nav {
                position: sticky;
                top: 0;
                z-index: 100;
                background: rgba(11, 16, 32, 0.9);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding: 0 20px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            }

            .nav-container {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 64px;
            }

            .nav-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                font-size: 1.4rem;
                font-weight: 800;
                color: var(--text-white);
                letter-spacing: -0.02em;
                transition: transform 0.2s;
                position: relative;
            }

            .nav-brand:hover {
                transform: scale(1.02);
                text-shadow: 0 0 10px rgba(13, 71, 255, 0.7);
            }

            .nav-logo-icon {
                font-size: 1.6rem;
                filter: drop-shadow(0 0 8px rgba(13, 71, 255, 0.7));
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.7;
                }
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .nav-link {
                text-decoration: none;
                color: var(--text-muted);
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.2s ease;
                position: relative;
                padding: 6px 0;
                letter-spacing: 0.02em;
            }

            .nav-link:hover {
                color: var(--primary-blue);
            }

            .nav-link::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                width: 0%;
                height: 2px;
                background: var(--primary-blue);
                transition: width 0.3s ease;
                border-radius: 2px;
                box-shadow: 0 0 8px rgba(13, 71, 255, 0.5);
            }

            .nav-link:hover::after {
                width: 100%;
            }

            .nav-link.active {
                color: var(--primary-blue);
                font-weight: 700;
            }

            .nav-link.active::after {
                width: 100%;
                background: var(--primary-blue);
                box-shadow: 0 0 10px rgba(13, 71, 255, 0.7);
            }

            .sign-out-btn {
                background: rgba(255, 95, 109, 0.15);
                color: var(--danger-red);
                border: 1px solid rgba(255, 95, 109, 0.3);
                padding: 8px 18px;
                border-radius: 50px;
                font-weight: 700;
                font-size: 0.9rem;
                transition: all 0.2s ease;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .sign-out-btn:hover {
                background: var(--danger-red);
                color: var(--text-white);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(255, 95, 109, 0.3);
                animation: pulse 1.5s infinite;
            }

            .nav-mobile-toggle {
                display: none;
                flex-direction: column;
                gap: 5px;
                cursor: pointer;
                background: transparent;
                border: none;
                padding: 5px;
            }

            .nav-mobile-toggle span {
                width: 24px;
                height: 2px;
                background: var(--text-white);
                border-radius: 2px;
                transition: 0.3s;
            }

            @media (max-width: 768px) {
                .nav-mobile-toggle {
                    display: flex;
                }

                .nav-links {
                    position: absolute;
                    top: 64px;
                    left: 0;
                    right: 0;
                    background: rgba(15, 32, 64, 0.98);
                    backdrop-filter: blur(20px);
                    flex-direction: column;
                    padding: 20px;
                    gap: 20px;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                    transform: translateY(-100%);
                    opacity: 0;
                    pointer-events: none;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
                }

                .nav-links.active {
                    transform: translateY(0);
                    opacity: 1;
                    pointer-events: all;
                }
            }

            /* main container */
            .login-container {
                max-width: 500px;
                margin: 4rem auto;
                padding: 1.5rem;
                position: relative;
                z-index: 2;
            }
            .login-card {
                background: #151c32;
                border-radius: var(--radius);
                border: 1px solid rgba(13, 71, 255, 0.25);
                padding: 2.5rem;
                box-shadow: var(--shadow-card);
                backdrop-filter: blur(12px);
                position: relative;
                overflow: hidden;
                transform: translateZ(0);
            }

            .login-title {
                text-align: center;
                margin-bottom: 2rem;
                position: relative;
            }
            .login-title h1 {
                font-family: var(--font-display);
                font-size: 2.2rem;
                font-weight: 700;
                background: linear-gradient(
                    135deg,
                    var(--gold),
                    var(--primary-blue)
                );
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 0.5rem;
            }
            .login-title p {
                color: var(--text-muted);
                font-weight: 500;
                font-size: 1rem;
                margin-top: 8px;
                position: relative;
            }
            .login-title p::after {
                content: "";
                position: absolute;
                bottom: -8px;
                left: 50%;
                transform: translateX(-50%);
                width: 60px;
                height: 3px;
                background: linear-gradient(
                    90deg,
                    var(--primary-blue),
                    var(--gold)
                );
                border-radius: 3px;
            }
            .form-group {
                margin-bottom: 1.5rem;
                position: relative;
            }
            .form-group label {
                display: block;
                margin-bottom: 0.6rem;
                font-weight: 600;
                color: var(--text-white);
                font-size: 1rem;
                letter-spacing: 0.5px;
            }
            .form-input {
                width: 100%;
                padding: 1rem 1.2rem;
                background: #1b2442;
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: var(--radius-sm);
                color: var(--text-white);
                font-family: var(--font-primary);
                font-size: 1rem;
                transition: all 0.3s ease;
                box-shadow: 0 0 10px rgba(13, 71, 255, 0.2);
                position: relative;
                z-index: 2;
            }
            .form-input:focus {
                outline: none;
                border-color: var(--primary-blue);
                box-shadow: 0 0 15px rgba(13, 71, 255, 0.5);
                transform: translateY(-2px);
            }
            .btn {
                width: 100%;
                padding: 1.1rem;
                background: linear-gradient(
                    135deg,
                    var(--primary-blue),
                    var(--secondary-purple)
                );
                color: var(--text-white);
                border: none;
                border-radius: var(--radius-sm);
                font-family: var(--font-display);
                font-weight: 700;
                font-size: 1.1rem;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
                box-shadow: 0 0 20px rgba(13, 71, 255, 0.4);
                letter-spacing: 0.5px;
                text-transform: uppercase;
                font-weight: 600;
                transform: translateZ(0);
            }
            .btn:hover {
                background: linear-gradient(135deg, #1a58ff, #8c44ff);
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(13, 71, 255, 0.6);
            }
            .btn:active {
                transform: translateY(0);
            }
            .register-link {
                text-align: center;
                margin-top: 2rem;
                color: var(--text-muted);
                font-weight: 500;
            }
            .register-link a {
                color: var(--gold);
                text-decoration: none;
                font-weight: 600;
                position: relative;
                padding: 0 5px;
            }
            .register-link a::after {
                content: "";
                position: absolute;
                bottom: -2px;
                left: 0;
                width: 100%;
                height: 1px;
                background: var(--gold);
                transform: scaleX(0);
                transition: transform 0.3s ease;
            }
            .register-link a:hover::after {
                transform: scaleX(1);
            }
            .register-link a:hover {
                text-shadow: 0 0 10px rgba(248, 198, 58, 0.5);
            }
            .error-message {
                color: var(--danger-red);
                font-weight: 600;
                margin-top: 1rem;
                text-align: center;
                animation: fadeIn 0.5s ease;
            }
            .success-message {
                color: var(--success-green);
                font-weight: 600;
                margin-top: 1rem;
                text-align: center;
                animation: fadeIn 0.5s ease;
            }

            /* Animations */
            @keyframes pulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.1);
                }
                100% {
                    transform: scale(1);
                }
            }

            @keyframes borderAnimation {
                0% {
                    background-position: 0% 50%;
                }
                100% {
                    background-position: 100% 50%;
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* mobile */
            @media (max-width: 680px) {
                .login-container {
                    padding: 1rem;
                    margin: 1.5rem auto;
                }
                .login-card {
                    padding: 1.8rem;
                }
                .login-title h1 {
                    font-size: 1.8rem;
                }
            }

            /* Decorative elements */
            .decoration {
                position: absolute;
                z-index: 1;
                opacity: 0.1;
            }

            .decoration-1 {
                width: 200px;
                height: 200px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    var(--primary-blue),
                    transparent 70%
                );
                top: 10%;
                left: 10%;
                animation: float 15s infinite ease-in-out;
            }

            .decoration-2 {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    var(--secondary-purple),
                    transparent 70%
                );
                bottom: 15%;
                right: 15%;
                animation: float 18s infinite ease-in-out reverse;
            }

            .decoration-3 {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    var(--gold),
                    transparent 70%
                );
                top: 40%;
                right: 20%;
                animation: float 12s infinite ease-in-out;
            }

            @keyframes float {
                0% {
                    transform: translate(0, 0) rotate(0deg);
                }
                33% {
                    transform: translate(20px, 20px) rotate(10deg);
                }
                66% {
                    transform: translate(-20px, 10px) rotate(-10deg);
                }
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }
            }
        </style>
    </head>
    <body>
        <!-- ── NAVBAR ── -->
        <nav class="main-nav">
            <div class="nav-container">
                <a href="/" class="nav-brand"
                    ><span class="nav-logo-icon">⚽</span> Fantasy SV</a
                >
                <button
                    class="nav-mobile-toggle"
                    onclick="
                        document
                            .getElementById('nav-links')
                            .classList.toggle('active')
                    "
                >
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-links" id="nav-links">
                    <a href="/schedule" class="nav-link">Calendario</a>
                    <a href="/leaderboard" class="nav-link">Clasificación</a>
                    <span id="nav-auth"></span>
                </div>
            </div>
        </nav>

        <main x-data="loginApp()">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-title">
                        <h1>🔐 Iniciar Sesión</h1>
                        <p>Accede a tu cuenta de Fantasy</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="login-form">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                x-model="email"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                x-model="password"
                                required
                            />
                        </div>

                        <button type="submit" class="btn">
                            Iniciar Sesión
                        </button>

                        <div
                            class="error-message"
                            x-show="error"
                            x-text="error"
                        ></div>
                        <div
                            class="success-message"
                            x-show="success"
                            x-text="success"
                        ></div>
                    </form>

                    <div class="register-link">
                        ¿No tienes cuenta?
                        <a href="/register">Regístrate aquí</a>
                    </div>
                </div>
            </div>

            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>
            <div class="decoration decoration-3"></div>
        </main>

        <script>
            function loginApp() {
                return {
                    email: "",
                    password: "",
                    error: "",
                    success: "",

                    handleLogin() {
                        // Simple validation
                        if (!this.email || !this.password) {
                            this.error = "Por favor completa todos los campos";
                            return;
                        }

                        // Make actual API call
                        fetch("/auth/login", {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded",
                            },
                            body: new URLSearchParams({
                                username: this.email,
                                password: this.password,
                            }),
                        })
                            .then((response) => {
                                if (!response.ok) {
                                    throw new Error("Credenciales inválidas");
                                }
                                return response.json();
                            })
                            .then((data) => {
                                // Store JWT token
                                localStorage.setItem(
                                    "jwt_token",
                                    data.access_token,
                                );

                                // Check if onboarding is complete
                                fetch("/auth/me", {
                                    headers: {
                                        Authorization: `Bearer ${data.access_token}`,
                                    },
                                })
                                    .then((response) => response.json())
                                    .then((user) => {
                                        console.log(user);
                                        if (
                                            user.onboarding_complete === false
                                        ) {
                                            if (window.umami) {
                                                window.umami.track("login", {
                                                    redirect: "ONBOARDING",
                                                });
                                            }

                                            window.location.href =
                                                "/onboarding";
                                        } else if (user.role === "admin") {
                                            if (window.umami) {
                                                window.umami.track("login", {
                                                    redirect: "ADMIN",
                                                });
                                            }

                                            window.location.href =
                                                "/admin-dashboard";
                                        } else {
                                            if (window.umami) {
                                                window.umami.track("login", {
                                                    redirect: "SQUAD-BUILDER",
                                                });
                                            }

                                            window.location.href =
                                                "/squad-builder";
                                        }
                                    });
                            })
                            .catch((error) => {
                                this.error = "Credenciales inválidas";
                                this.success = "";
                            });
                    },
                };
            }
        </script>
    </body>
</html>
