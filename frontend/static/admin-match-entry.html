<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fantasy World Cup – Admin Match Entry</title>
    <link rel="stylesheet" href="/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<!-- ── MAIN NAVIGATION ── -->
<nav class="main-nav">
  <div class="nav-container">
    <a href="/" class="nav-brand">
      <span class="nav-logo-icon">⚽</span>
      Fantasy SV
    </a>
    
    <button class="nav-mobile-toggle" onclick="document.getElementById('nav-links').classList.toggle('active')">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-links" id="nav-links">
      <a href="squad-builder.html" class="nav-link">My Squad</a>
      <a href="leaderboard.html" class="nav-link">Leaderboard</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button class="sign-out-btn">Sign Out</button>
    </div>
  </div>
</nav>

    <div class="container" x-data="matchEntryApp()" x-init="init()">
        <header>
            <h1>📊 Match Result Entry</h1>
            <div class="filters-row" style="display: flex; gap: 15px; margin-top: 15px;">
                <label>Season:
                    <select x-model="selectedSeasonId" @change="loadLeaguesAndMatchdays()" style="padding: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="">-- Select Season --</option>
                        <template x-for="s in seasons" :key="s.id">
                            <option :value="s.id" x-text="s.name"></option>
                        </template>
                    </select>
                </label>
                <label>League:
                    <select x-model="selectedLeagueId" @change="loadPlayers()" style="padding: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="">-- All Leagues --</option>
                        <template x-for="l in leagues" :key="l.id">
                            <option :value="l.id" x-text="l.name"></option>
                        </template>
                    </select>
                </label>
                <label>Matchday:
                    <select x-model="matchdayId" @change="onMatchdayChange()" style="padding: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="">-- Select Matchday --</option>
                        <template x-for="m in matchdays" :key="m.id">
                            <option :value="m.id" x-text="m.name"></option>
                        </template>
                    </select>
                </label>
            </div>
            <div x-show="matchdayDeadline" style="margin-top: 10px; font-weight: bold; color: var(--teal);">
                Deadline: <span x-text="new Date(matchdayDeadline).toLocaleString()"></span>
            </div>
        </header>

        <div x-show="loading" class="loading">Loading players...</div>

        <template x-if="!loading && teams.length">
            <div>
                <div class="bulk-import-section" style="margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;">
                    <h3 style="margin-bottom: 10px;">Bulk Import Results (CSV)</h3>
                    <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px;">
                        Headers expected: <code>player_id, minutes_played, goals, assists, goals_conceded, yellow_card, red_card, own_goal, penalty_missed, penalty_saved</code>
                    </p>
                    <textarea x-model="csvData" rows="5" style="width: 100%; font-family: monospace; padding: 10px; border-radius: 4px; background: var(--navy); color: var(--text-white); border: 1px solid var(--teal);" placeholder="Paste CSV data here..."></textarea>
                    <button type="button" @click="parseCSV()" style="margin-top: 10px; background: var(--blue-accent); border: none; padding: 8px 15px; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer;">Load CSV Data</button>
                </div>
            <form @submit.prevent="submitStats">
                <div class="table-responsive">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Team / Player</th>
                                <th>Min</th>
                                <th>G</th>
                                <th>A</th>
                                <th>GC</th>
                                <th>YC</th>
                                <th>RC</th>
                                <th>OG</th>
                                <th>PM</th>
                                <th>PS</th>
                            </tr>
                            <tr class="legend">
                                <td colspan="10">
                                    <small>Min=Minutes, G=Goals, A=Assists, GC=Goals Conceded, YC=Yellow, RC=Red, OG=Own Goal, PM=Penalty Missed, PS=Penalty Saved</small>
                                </td>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="team in teams" :key="team.team_id">
                                <!-- Team separator row -->
                                <tr class="team-separator">
                                    <td colspan="10" x-text="team.team_name"></td>
                                </tr>
                                <template x-for="player in team.players" :key="player.player_id">
                                    <tr :data-team="team.team_id">
                                        <td class="player-name" x-text="player.name"></td>
                                        <td><input type="number" x-model="player.stats.minutes_played" min="0" step="1" required></td>
                                        <td><input type="number" x-model="player.stats.goals" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.assists" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.goals_conceded" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.yellow_card" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.red_card" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.own_goal" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.penalty_missed" min="0" step="1"></td>
                                        <td><input type="number" x-model="player.stats.penalty_saved" min="0" step="1"></td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="actions">
                    <button type="submit" :disabled="submitting">
                        <span x-show="!submitting">📤 Submit Match Results</span>
                        <span x-show="submitting">⏳ Submitting...</span>
                    </button>
                </div>
            </form>
                </div>
            </form>
            </div>
        </template>

        <!-- Confirmation / error messages -->
        <div x-show="message" class="message" :class="messageType" x-text="message"></div>

        <!-- Task status polling display -->
        <div x-show="taskStatus" class="task-status">
            <strong>Task Status:</strong> <span x-text="taskStatus"></span>
            <progress x-show="taskStatus === 'processing'" class="progress"></progress>
        </div>
    </div>

    <script>
        function matchEntryApp() {
            return {
                seasons: [],
                leagues: [],
                matchdays: [],
                selectedSeasonId: '',
                selectedLeagueId: '',
                matchdayId: '',
                matchdayDeadline: '',
                csvData: '',
                teams: [],
                loading: false,
                submitting: false,
                message: '',
                messageType: '',
                taskId: null,
                taskStatus: null,
                pollInterval: null,

                async init() {
                    // Fetch seasons on load
                    try {
                        const res = await fetch('/admin/seasons', { headers: { 'Authorization': 'Bearer dummy-admin-token' } });
                        if (res.ok) {
                            const data = await res.json();
                            this.seasons = data.seasons;
                        }
                    } catch (e) {
                        this.showMessage('Failed to load seasons', 'error');
                    }
                },

                async loadLeaguesAndMatchdays() {
                    this.leagues = [];
                    this.matchdays = [];
                    this.selectedLeagueId = '';
                    this.matchdayId = '';
                    this.matchdayDeadline = '';
                    this.teams = [];
                    if (!this.selectedSeasonId) return;
                    
                    try {
                        const [resL, resM] = await Promise.all([
                            fetch(`/admin/seasons/${this.selectedSeasonId}/leagues`, { headers: { 'Authorization': 'Bearer dummy-admin-token' } }),
                            fetch(`/admin/seasons/${this.selectedSeasonId}/matchdays`, { headers: { 'Authorization': 'Bearer dummy-admin-token' } })
                        ]);
                        if (resL.ok) {
                            const dataL = await resL.json();
                            this.leagues = dataL.leagues;
                        }
                        if (resM.ok) {
                            const dataM = await resM.json();
                            this.matchdays = dataM.matchdays;
                        }
                    } catch (e) {
                        this.showMessage('Failed to load leagues/matchdays', 'error');
                    }
                },

                onMatchdayChange() {
                    const matchday = this.matchdays.find(m => m.id === parseInt(this.matchdayId));
                    if (matchday && matchday.deadline_utc) {
                        this.matchdayDeadline = matchday.deadline_utc;
                    } else {
                        this.matchdayDeadline = '';
                    }
                    this.loadPlayers();
                },

                parseCSV() {
                    if (!this.csvData) return;
                    const lines = this.csvData.split('\n').filter(l => l.trim() !== "");
                    if (lines.length < 2) {
                        this.showMessage("CSV must have headers and at least one data row.", "error");
                        return;
                    }
                    const headers = lines[0].split(',').map(h => h.trim());
                    
                    const parsedData = {};
                    for (let i = 1; i < lines.length; i++) {
                        const vals = lines[i].split(',').map(v => v.trim());
                        let row = {};
                        headers.forEach((h, idx) => {
                            let val = vals[idx];
                            row[h] = val ? parseInt(val) : 0;
                        });
                        if (row.player_id) {
                            parsedData[row.player_id] = row;
                        }
                    }

                    // map to this.teams
                    for (let team of this.teams) {
                        for (let player of team.players) {
                            if (parsedData[player.player_id]) {
                                const pData = parsedData[player.player_id];
                                player.stats.minutes_played = pData.minutes_played || 0;
                                player.stats.goals = pData.goals || 0;
                                player.stats.assists = pData.assists || 0;
                                player.stats.goals_conceded = pData.goals_conceded || 0;
                                player.stats.yellow_card = pData.yellow_card || 0;
                                player.stats.red_card = pData.red_card || 0;
                                player.stats.own_goal = pData.own_goal || 0;
                                player.stats.penalty_missed = pData.penalty_missed || 0;
                                player.stats.penalty_saved = pData.penalty_saved || 0;
                            }
                        }
                    }
                    this.showMessage("CSV data successfully populated into the table.", "success");
                },

                async loadPlayers() {
                    if (!this.matchdayId) {
                        this.teams = [];
                        return;
                    }
                    this.loading = true;
                    this.message = '';
                    try {
                        let url = `/admin/matchday/${this.matchdayId}/players`;
                        if (this.selectedLeagueId) {
                            url += `?league_id=${this.selectedLeagueId}`;
                        }
                        const res = await fetch(url, { headers: { 'Authorization': 'Bearer dummy-admin-token' } });
                        if (!res.ok) throw new Error('Failed to load players');
                        const data = await res.json();
                        // Initialize stats object for each player
                        this.teams = data.teams.map(team => ({
                            ...team,
                            players: team.players.map(player => ({
                                ...player,
                                stats: {
                                    minutes_played: 0,
                                    goals: 0,
                                    assists: 0,
                                    goals_conceded: 0,
                                    yellow_card: 0,
                                    red_card: 0,
                                    own_goal: 0,
                                    penalty_missed: 0,
                                    penalty_saved: 0
                                }
                            }))
                        }));
                    } catch (err) {
                        this.showMessage(err.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                validateStats() {
                    for (const team of this.teams) {
                        for (const player of team.players) {
                            const min = player.stats.minutes_played;
                            if (min === undefined || min === null || min < 0 || !Number.isInteger(min)) {
                                this.showMessage(`Minutes played for ${player.name} must be a non‑negative integer`, 'error');
                                return false;
                            }
                            // All other stats are optional but must be integers >=0
                            const fields = ['goals', 'assists', 'goals_conceded', 'yellow_card', 'red_card', 'own_goal', 'penalty_missed', 'penalty_saved'];
                            for (const f of fields) {
                                const val = player.stats[f];
                                if (val === undefined || val === null || val < 0 || !Number.isInteger(val)) {
                                    this.showMessage(`${f} for ${player.name} must be a non‑negative integer`, 'error');
                                    return false;
                                }
                            }
                        }
                    }
                    return true;
                },

                async submitStats() {
                    if (!this.validateStats()) return;
                    this.submitting = true;
                    this.message = '';
                    this.taskStatus = null;

                    // Build payload: list of player stat objects
                    const stats = [];
                    for (const team of this.teams) {
                        for (const player of team.players) {
                            stats.push({
                                player_id: player.player_id,
                                minutes_played: player.stats.minutes_played,
                                goals: player.stats.goals,
                                assists: player.stats.assists,
                                goals_conceded: player.stats.goals_conceded,
                                yellow_card: player.stats.yellow_card,
                                red_card: player.stats.red_card,
                                own_goal: player.stats.own_goal,
                                penalty_missed: player.stats.penalty_missed,
                                penalty_saved: player.stats.penalty_saved
                            });
                        }
                    }

                    try {
                        const res = await fetch(`/admin/matchday/${this.matchdayId}/results`, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer dummy-admin-token'
                            },
                            body: JSON.stringify({ stats })
                        });
                        if (!res.ok) {
                            const err = await res.json();
                            throw new Error(err.detail || 'Submission failed');
                        }
                        const data = await res.json();
                        this.taskId = data.task_id;
                        this.showMessage(`Task queued (ID: ${this.taskId}). Processing...`, 'success');
                        this.startPolling();
                    } catch (err) {
                        this.showMessage(err.message, 'error');
                    } finally {
                        this.submitting = false;
                    }
                },

                startPolling() {
                    if (this.pollInterval) clearInterval(this.pollInterval);
                    this.pollInterval = setInterval(async () => {
                        if (!this.taskId) return;
                        try {
                            const res = await fetch(`/admin/matchday/${this.matchdayId}/task-status`, { headers: { 'Authorization': 'Bearer dummy-admin-token' } });
                            if (!res.ok) throw new Error();
                            const data = await res.json();
                            this.taskStatus = data.status;
                            if (data.status === 'done' || data.status === 'failed') {
                                clearInterval(this.pollInterval);
                                this.pollInterval = null;
                                if (data.status === 'done') {
                                    this.showMessage('Matchday calculation completed successfully!', 'success');
                                } else {
                                    this.showMessage('Task failed. Check logs.', 'error');
                                }
                            }
                        } catch (err) {
                            // Ignore polling errors
                        }
                    }, 2000); // poll every 2 seconds
                },

                showMessage(msg, type) {
                    this.message = msg;
                    this.messageType = type;
                    setTimeout(() => {
                        if (this.message === msg) this.message = '';
                    }, 5000);
                }
            }
        }
    </script>
</body>
</html>
