<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso Denegado — Fantasy SV</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:        #0a1628;
      --navy-mid:    #0f2040;
      --navy-light:  #162a50;
      --navy-card:   #1a3260;
      --teal:        #00d4aa;
      --teal-dark:   #00a88a;
      --teal-glow:   rgba(0, 212, 170, 0.18);
      --gold:        #f5c842;
      --blue-accent: #00a8e8;
      --red-accent:  #ff5f6d;
      --red-glow:    rgba(255, 95, 109, 0.18);
      --text-white:  #ffffff;
      --text-dim:    rgba(255,255,255,0.55);
      --text-muted:  rgba(255,255,255,0.28);
      --font:        'Nunito', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--navy);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Ambient background blobs ── */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate;
    }
    .bg-blob-1 {
      width: 520px; height: 520px;
      background: var(--red-accent);
      top: -160px; left: -160px;
      animation-delay: 0s;
    }
    .bg-blob-2 {
      width: 400px; height: 400px;
      background: var(--teal);
      bottom: -120px; right: -120px;
      animation-delay: -4s;
    }
    .bg-blob-3 {
      width: 260px; height: 260px;
      background: var(--blue-accent);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -2s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── Grid overlay ── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(15, 32, 64, 0.72);
      border: 1px solid rgba(255, 95, 109, 0.22);
      border-radius: 20px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 460px;
      width: calc(100% - 2rem);
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.5),
        0 0 80px var(--red-glow);
      animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Icon ── */
    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--red-glow);
      border: 1.5px solid rgba(255, 95, 109, 0.35);
      margin-bottom: 1.5rem;
      animation: pulse-ring 2.4s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 95, 109, 0.35); }
      50%       { box-shadow: 0 0 0 14px rgba(255, 95, 109, 0); }
    }

    .icon-wrap svg {
      width: 36px; height: 36px;
    }

    /* ── Code badge ── */
    .code-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red-accent);
      background: var(--red-glow);
      border: 1px solid rgba(255, 95, 109, 0.3);
      border-radius: 6px;
      padding: 3px 10px;
      margin-bottom: 1rem;
    }

    /* ── Heading ── */
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 30%, rgba(255,255,255,0.55));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin-bottom: 1.75rem;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: var(--teal);
      color: var(--navy);
    }
    .btn-primary:hover {
      background: var(--teal-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--teal-glow);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-ghost:hover {
      color: var(--text-white);
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.04);
      transform: translateY(-2px);
    }

    .btn:active { transform: translateY(0); }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .footer-note a {
      color: var(--teal);
      text-decoration: none;
    }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="grid-overlay"></div>

  <div class="card">

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff5f6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="code-badge">Error 403</div>

    <h1>Acceso Denegado</h1>
    <p class="subtitle">
      No tienes permisos para ver esta página.<br/>
      Si crees que esto es un error, contacta al administrador.
    </p>

    <div class="divider"></div>

    <div class="actions">
      <a href="/" class="btn btn-primary">⚽ Volver al Inicio</a>
      <a href="/login" class="btn btn-ghost">Iniciar Sesión con otra cuenta</a>
    </div>

    <p class="footer-note">
      ¿Necesitas ayuda? <a href="https://www.instagram.com/devoleasv/">Contáctanos</a>
    </p>

  </div>

</body>
</html>
