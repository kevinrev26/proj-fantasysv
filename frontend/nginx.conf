server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    error_page 404 /404;

    # API proxy — exact prefix match with trailing slash or end
    location ~ ^/(admin|auth|health|test-celery|seasons|matchday|league|prediction)(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Squad API — separate to avoid matching /squad-builder
    location ~ ^/squad(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # This needs to change in production.
    sub_filter '</head>' '<script defer src="http://localhost:3000/script.js" data-website-id="6b2b3d8f-0547-4e40-8848-c25fafc810a0"></script></head>';

    # Static pages
    location = /                { try_files /index.html =404; }
    location = /login           { try_files /login.html =404; }
    location = /register        { try_files /register.html =404; }
    location = /admin-users     { try_files /admin-users.html =404; }
    location = /activate        { try_files /activate.html =404; }
    location = /onboarding      { try_files /onboarding.html =404; }
    location = /admin-dashboard { try_files /admin-dashboard.html =404; }
    location = /match-entry     { try_files /admin-match-entry.html =404; }
    location = /profile         { try_files /profile.html =404; }
    location = /leaderboard     { try_files /leaderboard.html =404; }
    location = /squad-builder   { try_files /squad-builder.html =404; }
    location = /schedule        { try_files /schedule.html =404; }
    location = /unauthorized    { try_files /unauthorized.html =404; }
    location = /404             { try_files /404.html =404; }
    location = /points          { try_files /points.html =404; }
    location = /leagues         { try_files /leagues.html =404; }
    location = /predictor       { try_files /predictor.html =404; }

    # Direct static file serving
    location ~* \.(html|css|js|ico|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }
}
