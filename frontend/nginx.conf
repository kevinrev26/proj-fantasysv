server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index admin-match-entry.html;

    # Proxy API requests to FastAPI backend
    location ~ ^/(admin|squad|auth|health|test-celery)(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Onboarding pages — served as static HTML
    location = /register { try_files /register.html =404; }
    location = /activate { try_files /activate.html =404; }
    location = /onboarding { try_files /onboarding.html =404; }
    location = /profile { try_files /profile.html =404; }

    location / {
        try_files $uri $uri/ /admin-match-entry.html;
    }
}
