#     Order of location blocks matters – Nginx evaluates:

#         Exact matches (=)

#         Regex matches (~ or ~*) in order of appearance

#         Prefix matches (/ at the end of the config)

#     Your regex blocks come before the location / fallback – good.

#     The proxy_pass does not include a trailing slash – Nginx will pass the original URI as-is.
#     Example: /admin/login → http://fastapi:8000/admin/login.

#     Static file rule – The regex block \.(html|css|js|...) will match .html files, so if you request /register.html directly,
#     it will serve the static file instead of hitting the exact-match /register rule. That's fine – both work.

#     Docker networking – The backend service fastapi is reachable because both frontend and fastapi services share the same custom network fantasy_net. Nginx uses the service name as hostname.

#     No HTTPS – This config serves only HTTP. For production, you would add another server block for port 443 with SSL certificates.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # API proxy — exact prefix match with trailing slash or end
    location ~ ^/(admin|auth|health|test-celery)(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Squad API — separate to avoid matching /squad-builder
    location ~ ^/squad(/|$) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static pages
    location = /              { try_files /index.html =404; }
    location = /register      { try_files /register.html =404; }
    location = /admin-users   { try_files /admin-users.html =404; }
    location = /activate      { try_files /activate.html =404; }
    location = /onboarding    { try_files /onboarding.html =404; }
    location = /admin-dashboard { try_files /admin-dashboard.html =404; }
    location = /match-entry   { try_files /admin-match-entry.html =404; }
    location = /profile       { try_files /profile.html =404; }
    location = /leaderboard   { try_files /leaderboard.html =404; }
    location = /squad-builder { try_files /squad-builder.html =404; }
    location = /schedule { try_files /schedule.html =404; }

    # Direct static file serving
    location ~* \.(html|css|js|ico|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }
}
