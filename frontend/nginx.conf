server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to FastAPI (if needed)
    # location /api/ {
    #     proxy_pass http://fastapi:8000/;
    #     proxy_set_header Host $host;
    # }
}
