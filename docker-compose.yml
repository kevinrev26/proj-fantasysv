services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fantasy_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fantasy_net

  umami_db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${UMAMI_USER}
      POSTGRES_PASSWORD: ${UMAMI_PASSWORD}
      POSTGRES_DB: ${UMAMI_DATABASE}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_USER} -d ${UMAMI_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fantasy_net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
      UMAMI_DEFAULT_EMAIL: ${UMAMI_DEFAULT_EMAIL}
      UMAMI_DEFAULT_PASSWORD: ${UMAMI_DEFAULT_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      umami_db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - fantasy_net

  celery_worker:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
    user: "nobody"
    command: celery -A app.worker worker --concurrency=2 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fantasy_net

  fastapi:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
    command: bash ./entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      umami:
        condition: service_healthy
    networks:
      - fantasy_net

  frontend:
    build: ./frontend
    environment:
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      NGINX_ENVSUBST_FILTER: "UMAMI_SCRIPT_URL UMAMI_WEBSITE_ID"
    ports:
      - "80:80"
    depends_on:
      fastapi:
        condition: service_started
      umami:
        condition: service_healthy
    networks:
      - fantasy_net

volumes:
  postgres_data:
  umami_postgres_data:

networks:
  fantasy_net:
    driver: bridge
